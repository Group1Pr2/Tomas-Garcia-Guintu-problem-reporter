<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NexusReport - Admin Dashboard</title>
  
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>

  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --border-color: #334155;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent-green: #10b981;
      --accent-green-hover: #059669;
      --accent-yellow: #f59e0b;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Inter', sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      padding: 40px 20px;
      min-height: 100vh;
      display: flex;
      justify-content: center;
    }

    .container {
      width: 100%;
      max-width: 1200px;
    }

    header {
      margin-bottom: 30px;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 20px;
    }

    header h1 { font-size: 1.75rem; font-weight: 700; }
    header p { color: var(--text-muted); font-size: 0.9rem; margin-top: 4px; }

    .table-card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
    }

    table { width: 100%; border-collapse: collapse; text-align: left; }
    th {
      background-color: #172033;
      color: var(--text-muted);
      font-size: 0.8rem;
      text-transform: uppercase;
      padding: 16px;
      border-bottom: 1px solid var(--border-color);
    }
    td { padding: 16px; border-bottom: 1px solid var(--border-color); font-size: 0.95rem; vertical-align: middle; }

    .badge {
      display: inline-flex;
      padding: 4px 10px;
      border-radius: 9999px;
      font-size: 0.8rem;
      font-weight: 600;
    }
    .badge-new { background: rgba(245, 158, 11, 0.15); color: var(--accent-yellow); border: 1px solid rgba(245, 158, 11, 0.3); }
    .badge-fixed { background: rgba(16, 185, 129, 0.15); color: var(--accent-green); border: 1px solid rgba(16, 185, 129, 0.3); }

    .btn-fix {
      background-color: var(--accent-green);
      color: #ffffff;
      border: none;
      padding: 8px 14px;
      border-radius: 6px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
    }
    .btn-fix:hover { background-color: var(--accent-green-hover); }

    /* Image preview style */
    .report-img {
      width: 52px;
      height: 52px;
      object-fit: cover;
      border-radius: 8px;
      border: 1px solid var(--border-color);
      transition: transform 0.2s ease;
    }
    .report-img:hover {
      transform: scale(1.15);
    }

    .modal-overlay {
      position: fixed;
      top: 0; left: 0; width: 100vw; height: 100vh;
      background: rgba(15, 23, 42, 0.75);
      backdrop-filter: blur(4px);
      display: flex; justify-content: center; align-items: center;
      opacity: 0; visibility: hidden; transition: all 0.25s ease;
      z-index: 999;
    }
    .modal-overlay.active { opacity: 1; visibility: visible; }
    .modal-box {
      background: #1e293b; border: 1px solid #334155;
      padding: 32px; border-radius: 16px; text-align: center; max-width: 400px; width: 90%;
    }
    .modal-icon {
      width: 56px; height: 56px; background: rgba(16, 185, 129, 0.15);
      color: #10b981; border-radius: 50%; display: flex;
      align-items: center; justify-content: center; font-size: 28px; margin: 0 auto 16px auto;
    }
    .modal-title { font-size: 1.25rem; font-weight: 700; margin-bottom: 8px; }
    .modal-desc { font-size: 0.9rem; color: #94a3b8; margin-bottom: 24px; }
    .modal-btn {
      background: #10b981; color: #ffffff; border: none;
      width: 100%; padding: 10px; border-radius: 8px; font-weight: 600; cursor: pointer;
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>🛠️ NexusReport Admin</h1>
      <p>Tomas Garcia Guintu SHS Maintenance Dashboard</p>
    </header>

    <div class="table-card">
      <table>
        <thead>
          <tr>
            <th>ID</th>
            <th>Photo</th>
            <th>Category</th>
            <th>Location</th>
            <th>Reporter Email</th>
            <th>Status</th>
            <th>Action</th>
          </tr>
        </thead>
        <tbody id="reportsTable">
          <tr><td colspan="7" style="text-align:center; padding: 40px; color: #94a3b8;">Loading campus reports...</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <div class="modal-overlay" id="customModal">
    <div class="modal-box">
      <div class="modal-icon" id="modalIcon">✓</div>
      <div class="modal-title" id="modalTitle">Issue Resolved!</div>
      <div class="modal-desc" id="modalDesc">Notification processed.</div>
      <button class="modal-btn" onclick="closeModal()">Awesome!</button>
    </div>
  </div>

  <script>
    const SUPABASE_URL = "https://ihvbmvdecjixxcpslwza.supabase.co"; 
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImlodmJtdmRlY2ppeHhjcHNsd3phIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU5MTYyODAsImV4cCI6MjEwMTQ5MjI4MH0.fxKNSRCgHrFEmB9yv_NmKKO00Nkp5mSy7E_8RSlzhnk";
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const EMAILJS_PUBLIC_KEY = "8apALGASJtUY7UXQp";
    const EMAILJS_SERVICE_ID = "service_9k12g44";
    const EMAILJS_TEMPLATE_ID = "template_7zb70js";
    emailjs.init(EMAILJS_PUBLIC_KEY);

    let currentReports = [];

    function showModal(title, message, isError = false) {
      document.getElementById('modalTitle').innerText = title;
      document.getElementById('modalDesc').innerText = message;
      document.getElementById('modalIcon').innerText = isError ? '✕' : '✓';
      document.getElementById('customModal').classList.add('active');
    }

    function closeModal() {
      document.getElementById('customModal').classList.remove('active');
    }

    function renderTable() {
      const tbody = document.getElementById('reportsTable');
      if (!currentReports.length) {
        tbody.innerHTML = '<tr><td colspan="7" style="text-align:center; padding: 40px; color: #94a3b8;">No reports found.</td></tr>';
        return;
      }

      tbody.innerHTML = '';
      const totalItems = currentReports.length;

      currentReports.forEach((report, index) => {
        const tr = document.createElement('tr');
        const isFixed = report.status === 'fixed' || report.status === 'done' || report.status === 'Resolved';
        
        // Dynamic continuous row numbering (e.g. #3, #2, #1)
        const displayId = totalItems - index;

        const photoHTML = report.image_url 
          ? `<a href="${report.image_url}" target="_blank" title="Click to view full image">
               <img src="${report.image_url}" class="report-img" alt="Report Evidence">
             </a>`
          : `<span style="color: var(--text-muted); font-size: 0.8rem;">No Photo</span>`;

        tr.innerHTML = `
          <td>#${displayId}</td>
          <td>${photoHTML}</td>
          <td><strong>${report.category || 'General'}</strong></td>
          <td>${report.location || 'N/A'}</td>
          <td>${report.user_email || 'Anonymous'}</td>
          <td>
            <span class="badge ${isFixed ? 'badge-fixed' : 'badge-new'}">
              ${isFixed ? 'Resolved' : (report.status || 'New')}
            </span>
          </td>
          <td>
            ${isFixed 
              ? '<span style="color: var(--accent-green); font-weight: 600;">✅ Completed</span>' 
              : `<button class="btn-fix" onclick="resolveReportByIndex(${index})">Mark as Fixed</button>`
            }
          </td>
        `;
        tbody.appendChild(tr);
      });
    }

    async function fetchReports() {
      const { data, error } = await supabaseClient.from('reports').select('*').order('id', { ascending: false });
      if (error) console.error('Error fetching reports:', error);
      currentReports = data || [];
      renderTable();
    }

    async function resolveReportByIndex(index) {
      const report = currentReports[index];
      if (!report) return;

      const { error } = await supabaseClient
        .from('reports')
        .update({ status: 'fixed' })
        .eq('id', report.id);

      if (error) {
        console.error('Supabase Update Error:', error);
        showModal('Update Failed', error.message || 'Database error occurred.', true);
        return;
      }

      report.status = 'fixed';
      renderTable();

      try {
        await emailjs.send(
          EMAILJS_SERVICE_ID,
          EMAILJS_TEMPLATE_ID,
          {
            to_email: report.user_email,
            category: report.category || 'General',
            location: report.location || 'Campus'
          },
          EMAILJS_PUBLIC_KEY
        );
        showModal('Issue Fixed!', `Resolved "${report.category}" and sent email notification.`);
      } catch (err) {
        console.error('EmailJS Error:', err);
        showModal('Partial Success', 'Status saved to database, but email failed to send.');
      }
    }

    // Subscribe to realtime database changes (Auto-update on row deletion or addition)
    function setupRealtimeListener() {
      supabaseClient
        .channel('public:reports')
        .on('postgres_changes', { event: '*', schema: 'public', table: 'reports' }, () => {
          fetchReports();
        })
        .subscribe();
    }

    fetchReports();
    setupRealtimeListener();
  </script>
</body>
</html>
