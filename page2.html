<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2a55f5">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<script>window.SERVIRE_STANDALONE=true</script>
<title>Servire Classroom</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700;800&display=swap">
<style>
/* Layout: top bar with role switch, left nav (bottom tabs on phones), one content column. Playful Fredoka headings, calm Nunito body, yellow reserved for XP and rewards. */
:root{
  --bg:#f2f5fb; --surface:#ffffff; --surface2:#e9eef9; --fg:#15203b; --muted:#56637f; --line:#d8dfee;
  --accent:#2a55f5; --accent-fg:#ffffff; --pop:#ffc21a; --pop-fg:#3a2a00;
  --good:#0b8a6a; --good-bg:#dcf5ec; --warn:#9a5b00; --warn-bg:#fff0d1; --bad:#c62f40; --bad-bg:#fde3e6; --info:#2a55f5; --info-bg:#e1e9ff;
  --c1:#0b8a6a; --c2:#d9531e; --c3:#6a4cf0; --c4:#cf2c6b; --on-c:#ffffff;
  --font-display:'Fredoka','Trebuchet MS',system-ui,sans-serif;
  --font-body:'Nunito','Segoe UI',system-ui,sans-serif;
  --shadow:0 1px 2px rgba(21,32,59,.06),0 8px 24px rgba(21,32,59,.07);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0e1426; --surface:#172039; --surface2:#1f2b4b; --fg:#eaf0ff; --muted:#9eacd0; --line:#2b3961;
  --accent:#86a2ff; --accent-fg:#0b1230; --pop:#ffc21a; --pop-fg:#3a2a00;
  --good:#46d3a8; --good-bg:#12372f; --warn:#f2b04a; --warn-bg:#3b2c10; --bad:#ff8a94; --bad-bg:#40181f; --info:#86a2ff; --info-bg:#1d2b5c;
  --c1:#46d3a8; --c2:#ff9b69; --c3:#a995ff; --c4:#ff77ab; --on-c:#0b1230;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1426; --surface:#172039; --surface2:#1f2b4b; --fg:#eaf0ff; --muted:#9eacd0; --line:#2b3961;
  --accent:#86a2ff; --accent-fg:#0b1230; --pop:#ffc21a; --pop-fg:#3a2a00;
  --good:#46d3a8; --good-bg:#12372f; --warn:#f2b04a; --warn-bg:#3b2c10; --bad:#ff8a94; --bad-bg:#40181f; --info:#86a2ff; --info-bg:#1d2b5c;
  --c1:#46d3a8; --c2:#ff9b69; --c3:#a995ff; --c4:#ff77ab; --on-c:#0b1230;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:16px;line-height:1.5;
  padding-block:16px 32px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--font-display);font-weight:600;line-height:1.2;margin:0;text-wrap:balance}
h1{font-size:clamp(1.5rem,4.5vw,2.1rem)} h2{font-size:1.3rem} h3{font-size:1.05rem}
p{margin:0} small{color:var(--muted);font-size:.85rem}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.wrap{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:20px}

/* top bar */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--font-display);font-weight:700;font-size:1.35rem}
.logo{width:36px;height:36px;border-radius:12px;background:var(--pop);color:var(--pop-fg);display:grid;place-items:center}
.seg{display:inline-flex;background:var(--surface2);border-radius:999px;padding:4px;gap:2px}
.seg button{border:0;background:transparent;padding:8px 16px;border-radius:999px;font-weight:800;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--fg);box-shadow:var(--shadow)}

/* shell */
.shell{display:grid;grid-template-columns:220px minmax(0,1fr);gap:24px;align-items:start}
.side{position:sticky;top:16px;display:flex;flex-direction:column;gap:6px}
.side .who{padding:12px;border-radius:16px;background:var(--surface);box-shadow:var(--shadow);margin-bottom:8px;display:flex;gap:10px;align-items:center}
.avatar{width:40px;height:40px;border-radius:50%;background:var(--accent);color:var(--accent-fg);display:grid;place-items:center;font-family:var(--font-display);font-weight:700;flex:none}
.nav{display:flex;align-items:center;gap:12px;padding:11px 14px;border:0;border-radius:14px;background:transparent;font-weight:800;color:var(--muted);text-align:left;width:100%}
.nav svg{width:22px;height:22px;flex:none}
.nav:hover{background:var(--surface2)}
.nav[aria-current="page"]{background:var(--accent);color:var(--accent-fg)}
.reset{margin-top:12px;background:none;border:0;color:var(--muted);text-decoration:underline;font-size:.85rem;text-align:left;padding:4px 14px}
main{display:flex;flex-direction:column;gap:20px;min-width:0}

/* cards and parts */
.card{background:var(--surface);border-radius:20px;box-shadow:var(--shadow);padding:20px;min-width:0}
.card-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:12px;flex-wrap:wrap}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:20px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,240px),1fr));gap:16px}
.stack{display:flex;flex-direction:column;gap:10px}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.grow{flex:1;min-width:0;display:flex;flex-direction:column}
.muted{color:var(--muted)}
.btn{border:0;border-radius:14px;padding:11px 18px;font-weight:800;background:var(--surface2);color:var(--fg)}
.btn:hover{filter:brightness(.97)}
.btn.primary{background:var(--accent);color:var(--accent-fg)}
.btn.pop{background:var(--pop);color:var(--pop-fg)}
.btn.small{padding:7px 12px;font-size:.9rem;border-radius:12px}
.btn[disabled]{opacity:.55;cursor:default}
.pill{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:999px;background:var(--surface2);color:var(--muted);font-size:.8rem;font-weight:800;white-space:nowrap}
.pill.good{background:var(--good-bg);color:var(--good)} .pill.bad{background:var(--bad-bg);color:var(--bad)}
.pill.info{background:var(--info-bg);color:var(--info)} .pill.warn{background:var(--warn-bg);color:var(--warn)}
.eyebrow{font-size:.78rem;font-weight:800;text-transform:uppercase;letter-spacing:.08em}

.hero{background:var(--accent);color:var(--accent-fg);border-radius:24px;padding:24px;display:flex;gap:24px;justify-content:space-between;flex-wrap:wrap;align-items:center}
.hero>div:first-child{flex:1 1 300px;display:flex;flex-direction:column;gap:10px}
.xpbar{height:14px;border-radius:99px;background:rgba(255,255,255,.28);overflow:hidden;max-width:420px}
:root[data-theme="dark"] .xpbar{background:rgba(11,18,48,.25)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .xpbar{background:rgba(11,18,48,.25)}}
.xpbar i{display:block;height:100%;background:var(--pop);border-radius:99px;transition:width .5s}
.hero-stats{display:flex;gap:12px}
.hero-stats div{background:rgba(255,255,255,.18);border-radius:16px;padding:12px 18px;text-align:center;min-width:92px}
:root[data-theme="dark"] .hero-stats div{background:rgba(11,18,48,.18)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .hero-stats div{background:rgba(11,18,48,.18)}}
.hero-stats b{display:block;font-family:var(--font-display);font-size:1.7rem;line-height:1.1}
.hero-stats span{font-size:.8rem;font-weight:700}

.item{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:2px solid var(--line);background:var(--surface);border-radius:16px;padding:12px 14px}
.item:hover{border-color:var(--accent)}
.item b{display:block}
.dot{width:12px;height:12px;border-radius:50%;background:var(--cc);flex:none}
.chk{width:26px;height:26px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;flex:none;color:transparent}
.chk.on{background:var(--good);border-color:var(--good);color:#fff}
.chk svg{width:16px;height:16px}

.course{padding:0;overflow:hidden;display:flex;flex-direction:column;text-align:left;border:0;width:100%}
.course .band{background:var(--cc);color:var(--on-c);padding:16px;display:flex;justify-content:space-between;align-items:center}
.course .band span{font-family:var(--font-display);font-weight:700;font-size:1.6rem}
.course .body{padding:14px 16px 16px;display:flex;flex-direction:column;gap:8px;background:var(--surface)}
.course:hover{transform:translateY(-2px)}
.bar{height:10px;border-radius:99px;background:var(--surface2);overflow:hidden}
.bar i{display:block;height:100%;background:var(--cc,var(--accent));border-radius:99px}

.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:12px}
.badge{border:2px dashed var(--line);border-radius:16px;padding:12px;text-align:center;display:flex;flex-direction:column;gap:4px;align-items:center;opacity:.7}
.badge.on{border:2px solid var(--pop);opacity:1;background:var(--surface)}
.badge .star{width:40px;height:40px;border-radius:50%;background:var(--surface2);display:grid;place-items:center;color:var(--muted)}
.badge.on .star{background:var(--pop);color:var(--pop-fg)}
.badge svg{width:22px;height:22px}

/* forms */
label{display:flex;flex-direction:column;gap:6px;font-weight:800;font-size:.9rem}
input,select,textarea{border:2px solid var(--line);background:var(--bg);border-radius:12px;padding:10px 12px;width:100%}
textarea{min-height:120px;resize:vertical}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr));gap:14px}
.form .full{grid-column:1/-1}

/* quiz */
.dots{display:flex;gap:6px}
.dots i{height:8px;flex:1;border-radius:9px;background:var(--surface2)}
.dots i.now{background:var(--accent)} .dots i.ok{background:var(--good)} .dots i.no{background:var(--bad)}
.opt{display:flex;gap:12px;align-items:center;width:100%;text-align:left;border:2px solid var(--line);background:var(--surface);border-radius:16px;padding:14px;font-weight:700;font-size:1.05rem}
.opt:hover:not([disabled]){border-color:var(--accent);background:var(--info-bg)}
.opt .l{width:30px;height:30px;border-radius:10px;background:var(--surface2);display:grid;place-items:center;font-family:var(--font-display);flex:none}
.opt.right{border-color:var(--good);background:var(--good-bg)} .opt.wrong{border-color:var(--bad);background:var(--bad-bg)}
.opt[disabled]{cursor:default}
.feedback{border-radius:16px;padding:14px;background:var(--surface2)}
.big{font-family:var(--font-display);font-size:3rem;line-height:1}

/* tables and charts */
.scroll{overflow-x:auto;border-radius:12px}
table{border-collapse:collapse;width:100%;min-width:620px;font-variant-numeric:tabular-nums}
th,td{padding:10px 12px;text-align:center;border-bottom:1px solid var(--line);font-size:.92rem}
th{font-size:.8rem;color:var(--muted);font-weight:800}
th:first-child,td:first-child{text-align:left;position:sticky;left:0;background:var(--surface);font-weight:800}
td.hi{color:var(--good);font-weight:800} td.mid{color:var(--warn);font-weight:800} td.lo{color:var(--bad);font-weight:800} td.wait{color:var(--info);font-weight:800}
.bars{display:flex;flex-direction:column;gap:10px}
.bars .b{display:grid;grid-template-columns:minmax(90px,1.2fr) 3fr 44px;gap:10px;align-items:center;font-size:.9rem;font-weight:700}
.bars .t{height:14px;background:var(--surface2);border-radius:99px;overflow:hidden}
.bars .t i{display:block;height:100%;background:var(--cc,var(--accent));border-radius:99px}
.bars .n{text-align:right;font-variant-numeric:tabular-nums}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,150px),1fr));gap:14px}
.tile{background:var(--surface);border-radius:18px;box-shadow:var(--shadow);padding:16px}
.tile b{display:block;font-family:var(--font-display);font-size:2rem;line-height:1.1}
.tile.pop{background:var(--pop);color:var(--pop-fg)} .tile.pop small{color:var(--pop-fg)}
.split{display:grid;grid-template-columns:minmax(0,300px) minmax(0,1fr);gap:20px;align-items:start}
.sub-text{background:var(--bg);border-radius:14px;padding:14px;white-space:pre-wrap;overflow-wrap:anywhere}
.news{border-left:5px solid var(--cc,var(--accent));padding:4px 0 4px 14px}

/* overlay, toast, fx */
.overlay{position:fixed;inset:0;background:rgba(10,16,36,.55);display:grid;place-items:center;padding:16px;z-index:50}
.dialog{background:var(--surface);border-radius:24px;max-width:560px;width:100%;max-height:85vh;overflow:auto;padding:24px;display:flex;flex-direction:column;gap:16px;box-shadow:var(--shadow)}
#toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--fg);color:var(--bg);padding:10px 18px;border-radius:99px;font-weight:800;opacity:0;pointer-events:none;transition:.25s;z-index:70;max-width:calc(100vw - 32px);text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:60}

.auth{max-width:440px;margin:16px auto;display:flex;flex-direction:column;gap:16px}
.auth .seg{align-self:center}
.err{color:var(--bad);font-weight:800;min-height:1.4em;font-size:.92rem}
.demo{background:var(--surface2);border-radius:14px;padding:12px 14px;font-size:.9rem;overflow-wrap:anywhere}
.acct{display:flex;align-items:center;gap:10px}
.linkbtn{background:none;border:0;color:var(--accent);font-weight:800;text-decoration:underline;padding:0}
a.btn{text-decoration:none;display:inline-block;text-align:center}
.dz{position:relative;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;border:2px dashed var(--line);border-radius:16px;padding:22px 16px;cursor:pointer;background:var(--bg)}
.dz:hover,.dz.over{border-color:var(--accent);background:var(--info-bg)}
.dz:focus-within{outline:3px solid var(--accent);outline-offset:2px}
.dz input{position:absolute;opacity:0;width:1px;height:1px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:8px;background:var(--surface2);border-radius:12px;padding:6px 10px;font-weight:700;font-size:.88rem;max-width:100%;overflow-wrap:anywhere}
.chip button{border:0;background:none;color:var(--bad);font-weight:800;padding:0}
.media{display:flex;flex-direction:column;gap:12px}
.media img,.media video{width:100%;max-height:420px;object-fit:contain;border-radius:14px;background:var(--surface2)}
.fileline{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--surface2);border-radius:14px;padding:10px 12px}
.ftag{font-family:var(--font-display);font-weight:700;font-size:.75rem;letter-spacing:.05em;border-radius:8px;padding:3px 8px;background:var(--accent);color:var(--accent-fg)}
.lec{border:2px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.lec p{white-space:pre-wrap;overflow-wrap:anywhere}
@media (max-width:820px){
  body{padding-bottom:96px}
  .shell{grid-template-columns:minmax(0,1fr)}
  .side{position:fixed;left:0;right:0;bottom:0;top:auto;flex-direction:row;gap:2px;background:var(--surface);border-top:1px solid var(--line);z-index:40;
    padding:6px max(6px,env(safe-area-inset-left,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(6px,env(safe-area-inset-right,0px))}
  .side .who,.reset{display:none}
  .nav{flex-direction:column;gap:2px;padding:6px 2px;font-size:.72rem;text-align:center;flex:1;justify-content:center}
  .split{grid-template-columns:minmax(0,1fr)}
  .hero{padding:20px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
.nav[aria-disabled="true"]{opacity:.45}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.wd{text-align:center;font-weight:800;font-size:.75rem;color:var(--muted);padding:4px 0}
.cd{min-height:68px;border:1px solid var(--line);border-radius:10px;padding:5px;display:flex;flex-direction:column;gap:4px;min-width:0;background:var(--surface)}
.cd.blank{border-color:transparent;background:transparent}
.cd.today{border-color:var(--accent);background:var(--info-bg)}
.dn{font-weight:800;font-size:.85rem}
.dots{display:flex;gap:3px;flex-wrap:wrap}
.dots i{width:9px;height:9px;border-radius:50%;display:block}
.qb{border:2px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:12px}
@media (max-width:820px){.side{overflow-x:auto}.nav{flex:0 0 auto;min-width:74px;padding:6px 8px}.cd{min-height:54px}}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
button,.btn,.nav,.opt,.item{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
@media (pointer:coarse){.btn,.opt,.item{min-height:46px}.btn.small{min-height:42px}.seg button{min-height:42px}.nav{min-height:50px}input,select{min-height:46px}}
.dialog{max-height:85vh;max-height:85dvh}
@media (max-width:480px){.card{padding:16px;border-radius:18px}.hero{padding:18px;border-radius:20px}.hero-stats{width:100%}.hero-stats div{flex:1;min-width:0}.brand{font-size:1.15rem}.tile b{font-size:1.6rem}.big{font-size:2.4rem}.cd{padding:3px}.dn{font-size:.75rem}.dots i{width:7px;height:7px}.bars .b{grid-template-columns:minmax(70px,1fr) 2fr 40px}.form{grid-template-columns:minmax(0,1fr)}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand"><span class="logo" aria-hidden="true"><svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l2.9 6.3 6.9.8-5.1 4.7 1.4 6.8L12 17.1 5.9 20.6l1.4-6.8L2.2 9.1l6.9-.8z"/></svg></span>Servire Classroom</div>
    <div class="acct" id="acct"></div>
  </header>
  <div id="login"></div>
  <div class="shell" id="shell" hidden>
    <nav class="side" id="side" aria-label="Main"></nav>
    <main id="main"></main>
  </div>
</div>
<div id="overlay-root"></div>
<div id="toast" role="status" aria-live="polite"></div>
<canvas id="fx" aria-hidden="true"></canvas>

<script>
(function(){
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const iso=d=>{const z=new Date(d.getTime()-d.getTimezoneOffset()*60000);return z.toISOString().slice(0,10)};
const addDays=n=>{const d=new Date();d.setDate(d.getDate()+n);return iso(d)};
const diffDays=s=>Math.round((new Date(s+'T00:00:00')-new Date(iso(new Date())+'T00:00:00'))/86400000);
const fmtDate=s=>new Date(s+'T00:00:00').toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'});
function dueText(s){const d=diffDays(s);if(d<0)return Math.abs(d)+(Math.abs(d)===1?' day':' days')+' late';if(d===0)return 'Due today';if(d===1)return 'Due tomorrow';return 'Due in '+d+' days'}

const ICON={
  home:'<path d="M3 10.5 12 3l9 7.5V21H3z"/><path d="M9 21v-6h6v6"/>',
  book:'<path d="M5 4h10a4 4 0 0 1 4 4v12H9a4 4 0 0 1-4-4z"/><path d="M9 20V8"/>',
  check:'<path d="m8 12 3 3 5-6"/><rect x="3.5" y="3.5" width="17" height="17" rx="4"/>',
  bolt:'<path d="M13 2 4 14h7l-1 8 9-12h-7z"/>',
  chart:'<path d="M5 20V11M11 20V4M17 20v-6M2 20h20"/>',
  pencil:'<path d="M4 20h4L19 9l-4-4L4 16z"/><path d="m14 6 4 4"/>',
  plus:'<path d="M12 5v14M5 12h14"/>',
  star:'<path d="m12 3 2.7 5.8 6.3.7-4.7 4.3 1.3 6.3-5.6-3.2-5.6 3.2 1.3-6.3L3 9.5l6.3-.7z"/>',
  tick:'<path d="m5 12 5 5 9-10"/>',

function idb(){return new Promise((res,rej)=>{try{const r=indexedDB.open('servire-files',1);r.onupgradeneeded=()=>r.result.createObjectStore('f');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error||new Error('idb'))}catch(e){rej(e)}})}
async function idbPut(id,blob){const d=await idb();return new Promise((res,rej)=>{const tx=d.transaction('f','readwrite');tx.objectStore('f').put(blob,id);tx.oncomplete=()=>res();tx.onerror=()=>rej(tx.error)})}

async function idbDel(id){const d=await idb();return new Promise((res,rej)=>{const tx=d.transaction('f','readwrite');tx.objectStore('f').delete(id);tx.oncomplete=()=>res();tx.onerror=()=>rej(tx.error)})}
function makeLocalDb(){
  const K='servire-db-v1',subs=[];
  const read=()=>{try{return JSON.parse(localStorage.getItem(K))||{}}catch(e){return {}}};
  const write=o=>{try{localStorage.setItem(K,JSON.stringify(o))}catch(e){throw {code:'quota_exceeded'}}};
  const fire=()=>subs.forEach(f=>f());
  return {
    collection(name){
      const q={
        orderBy(){return q},
        onSnapshot(next){
          const f=()=>{const rows=(read()[name]||[]).slice().sort((a,b)=>(b.data.ts||0)-(a.data.ts||0));next({docs:rows.map(r=>({id:r.id,data:()=>r.data}))})};
          subs.push(f);f();return ()=>{};
        },
        async add(data){const o=read();(o[name]=o[name]||[]).push({id:'d'+Date.now().toString(36)+Math.random().toString(36).slice(2,6),data});write(o);fire()}
      };
      return q;
    },
    doc(path){const p=path.split('/');return {async delete(){const o=read();o[p[0]]=(o[p[0]]||[]).filter(r=>r.id!==p[1]);write(o);fire()}}}
  };
}
function makeLocalAssets(){

    async delete(id){await idbDel(id);if(BLOBS[id]){URL.revokeObjectURL(BLOBS[id]);delete BLOBS[id]}return {deleted:true}}
  };
}

  if(c==='not_granted'||c==='capability_disabled'||c==='capability_removed')return 'This view can not upload files.';

function stage(list){

    if(!STANDALONE&&t.k==='pptx'&&f.size>14*MB){toast('PowerPoint files over 14 MB can not be shared. Export it as a PDF instead.');continue}

function gain(n){const b=Math.floor(S.xp/100);S.xp+=n;const a=Math.floor(S.xp/100);toast('+'+n+' XP'+(a>b?' · You reached level '+(a+1)+'!':''));if(a>b)confetti(60)}

function confetti(n){
  if(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  const cv=$('#fx');cv.width=innerWidth;cv.height=innerHeight;const ctx=cv.getContext('2d');
  const cols=['#ffc21a','#2a55f5','#0b8a6a','#ff7a3d','#e0397a'];
  const ps=Array.from({length:n||90},()=>({x:innerWidth/2+(Math.random()-.5)*220,y:innerHeight*.4,vx:(Math.random()-.5)*11,vy:-Math.random()*11-3,s:6+Math.random()*6,c:cols[(Math.random()*cols.length)|0],r:Math.random()*6,vr:(Math.random()-.5)*.4}));
  let f=0;(function step(){ctx.clearRect(0,0,cv.width,cv.height);ps.forEach(p=>{p.vy+=.36;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.r);ctx.fillStyle=p.c;ctx.fillRect(-p.s/2,-p.s/2,p.s,p.s*.6);ctx.restore()});if(++f<110)requestAnimationFrame(step);else ctx.clearRect(0,0,cv.width,cv.height)})();
}
function courseProgress(cid){
  const ls=LESSONS[cid],qs=QUIZZES.filter(x=>x.cid===cid);
  const total=ls.length+qs.length,done=ls.filter(l=>S.done[l.id]).length+qs.filter(q=>S.quizBest[q.id]).length;
  return {done,total,pct:total?Math.round(done/total*100):0};
}
function gradeOf(sid,cid){
  let sc=0,pt=0;S.assignments.forEach(a=>{if(cid&&a.cid!==cid)return;const s=subOf(a.id,sid);if(s&&s.status==='graded'){sc+=s.score;pt+=a.pts}});
  return pt?Math.round(sc/pt*100):null;
}
function pending(){const r=[];S.assignments.forEach(a=>STUDENTS.forEach(st=>{const s=subOf(a.id,st.id);if(s&&s.status==='submitted')r.push({a,sid:st.id})}));return r}
function classAvg(aid){const a=S.assignments.find(x=>x.id===aid);const v=STUDENTS.map(s=>subOf(aid,s.id)).filter(s=>s&&s.status==='graded').map(s=>s.score/a.pts);return v.length?Math.round(v.reduce((x,y)=>x+y,0)/v.length*100):null}

async function hash(s){
  try{const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));return Array.from(new Uint8Array(b)).map(x=>x.toString(16).padStart(2,'0')).join('')}
  catch(e){let h=5381;for(let i=0;i<s.length;i++)h=((h<<5)+h+s.charCodeAt(i))|0;return 'x'+(h>>>0).toString(16)}
}
function rand(){try{return Array.from(crypto.getRandomValues(new Uint8Array(8)),b=>b.toString(16).padStart(2,'0')).join('')}catch(e){return String(Math.random()).slice(2)+Date.now()}}

async function submitAuth(){
  const a=U.auth,email=val('f-email').trim().toLowerCase(),pw=val('f-pw');
  const err=m=>{const e=$('#auth-err');if(e)e.textContent=m};
  if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email))return err('Enter a valid email address.');
  if(!pw)return err('Enter your password.');
  if(a.mode==='signup'&&a.role==='student'){
    const name=val('f-name').trim();
    if(name.length<2)return err('Enter your full name.');
    if(pw.length<6)return err('Use at least 6 characters for your password.');
    if(pw!==val('f-pw2'))return err('The two passwords do not match.');
    if(S.accounts.some(x=>x.email===email))return err('That email already has an account. Try logging in.');
    const salt=rand(),sid='s'+Date.now().toString(36);
    const acc={email,name,role:'student',sid,salt,hash:await hash(salt+pw)};
    S.accounts.push(acc);S.students.push({id:sid,name});syncStudents();
    S.prog[sid]={xp:0,streak:0,done:{},badges:[],quizBest:{}};
    startSession(acc);return;
  }
  const acc=S.accounts.find(x=>x.email===email&&x.role===a.role);
  if(!acc||acc.hash!==await hash(acc.salt+pw))return err('Email or password is incorrect.');
  startSession(acc);
}

function tLectures(){
  const m=U.lt||'lec';
  const tabs='<div class="seg" role="group" aria-label="Lectures or quizzes"><button type="button" data-a="lt" data-m="lec" aria-pressed="'+(m==='lec')+'">Lectures</button><button type="button" data-a="lt" data-m="quiz" aria-pressed="'+(m==='quiz')+'">Quizzes</button></div>';
  return '<div class="stack" style="align-items:flex-start">'+tabs+'</div>'+(m==='quiz'?tQuizzes():tLecFiles());
}
function tQuizzes(){
  const d=U.qdraft||(U.qdraft={cid:'sci',title:'',qs:[blankQ()]});
  const opts=COURSES.map(c=>'<option value="'+c.id+'"'+(d.cid===c.id?' selected':'')+'>'+esc(c.name)+'</option>').join('');
  let notice='';
  if(CAP.ready&&!CAP.db)notice='<div class="feedback"><b>Quizzes can not be saved in this view.</b><p>Open this page in claude.ai while signed in.</p></div>';
  const qs=d.qs.map((x,i)=>'<div class="qb"><div class="row"><h3 class="grow">Question '+(i+1)+'</h3>'+(d.qs.length>1?'<button type="button" class="btn small" data-a="delQ" data-i="'+i+'">Remove</button>':'')+'</div>'
    +'<label for="q'+i+'-q">Question<input id="q'+i+'-q" value="'+esc(x.q)+'" placeholder="Type the question"></label>'
    +'<div class="form">'+[0,1,2,3].map(j=>'<label for="q'+i+'-o'+j+'">Option '+'ABCD'[j]+(j>1?' (optional)':'')+'<input id="q'+i+'-o'+j+'" value="'+esc(x.o[j])+'"></label>').join('')+'</div>'
    +'<div class="form"><label for="q'+i+'-a">Correct answer<select id="q'+i+'-a">'+[0,1,2,3].map(j=>'<option value="'+j+'"'+(x.a===j?' selected':'')+'>Option '+'ABCD'[j]+'</option>').join('')+'</select></label><label for="q'+i+'-w">Explanation shown after answering (optional)<input id="q'+i+'-w" value="'+esc(x.w)+'"></label></div></div>').join('');
  const list=QDB.map(q=>{const c=COURSE(q.cid)||COURSES[0];return '<div class="item" style="cursor:default"><span class="dot" style="--cc:var('+c.c+')"></span><span class="grow"><b>'+esc(q.t)+'</b><small>'+esc(c.name)+' · '+q.qs.length+' questions</small></span>'+(U.confirmQ===q.id?'<button class="btn small" style="color:var(--bad)" data-a="qDelDo" data-id="'+esc(q.id)+'">Confirm delete</button><button class="btn small" data-a="qDelCancel">Cancel</button>':'<button class="btn small" data-a="qDelAsk" data-id="'+esc(q.id)+'">Delete</button>')+'</div>'}).join('');
  return '<h1>Quizzes</h1><p class="muted">Each student gets one try per quiz. While a student is in a quiz, the lectures stay locked for them.</p>'+notice
    +'<section class="card stack" style="gap:14px" id="q-form"><h2>New quiz</h2><div class="form"><label for="q-course">Subject<select id="q-course">'+opts+'</select></label><label for="q-title">Quiz title<input id="q-title" value="'+esc(d.title)+'" placeholder="Example: Water cycle check"></label></div>'+qs
    +'<div class="row"><button type="button" class="btn" data-a="addQ"'+(d.qs.length>=20?' disabled':'')+'>Add a question</button><button type="button" class="btn primary" data-a="pubQuiz">Publish quiz</button></div></section>'
    +'<section class="card"><h2 style="margin-bottom:12px">Your published quizzes ('+QDB.length+')</h2><div class="stack">'+(list||'<p class="muted">Nothing published yet. The sample quizzes students already see are built in.</p>')+'</div></section>';
}
A.lt=d=>{collectQ();U.lt=d.m;render()};
A.addQ=()=>{collectQ();if(U.qdraft.qs.length<20)U.qdraft.qs.push(blankQ());render()};
A.delQ=d=>{collectQ();U.qdraft.qs.splice(+d.i,1);if(!U.qdraft.qs.length)U.qdraft.qs.push(blankQ());render()};
A.pubQuiz=async()=>{
  if(U.busy)return;collectQ();const d=U.qdraft;
  if(!d.title.trim()){toast('Add a quiz title.');return}
  const qs=[];
  for(let i=0;i<d.qs.length;i++){
    const x=d.qs[i],text=x.q.trim(),opts=x.o.map((s,j)=>({s:s.trim(),j})).filter(z=>z.s);
    if(!text){toast('Question '+(i+1)+' needs text.');return}
    if(opts.length<2){toast('Question '+(i+1)+' needs at least two options.');return}
    const ai=opts.findIndex(z=>z.j===x.a);
    if(ai<0){toast('Question '+(i+1)+': the correct answer points to an empty option.');return}
    qs.push({q:text,o:opts.map(z=>z.s),a:ai,w:x.w.trim()||'The correct answer is '+opts[ai].s+'.'});
  }
  if(!CAP.db){toast('Quizzes can not be saved in this view.');return}
  U.busy=true;
  try{
    await CAP.db.collection('quizzes').add({cid:d.cid,title:d.title.trim(),qs,ts:Date.now(),by:U.user.name});
    U.qdraft={cid:d.cid,title:'',qs:[blankQ()]};toast('Quiz published. Students can see it now.');
  }catch(e){toast(errText(e))}
  U.busy=false;render();
};
A.qDelAsk=d=>{U.confirmQ=d.id;render()};
A.qDelCancel=()=>{U.confirmQ=null;render()};
A.qDelDo=async d=>{
  U.confirmQ=null;
  try{await CAP.db.doc('quizzes/'+d.id).delete();toast('Quiz deleted.')}catch(e){toast(errText(e))}
  render();
};
A.calNav=d=>{const now=new Date(),c=U.cal||{y:now.getFullYear(),m:now.getMonth()},n=new Date(c.y,c.m+(+d.d),1);U.cal={y:n.getFullYear(),m:n.getMonth()};render()};
A.calToday=()=>{U.cal=null;render()};
A.playQuiz=d=>{if(S.quizBest[d.id]){toast('You already took this quiz.');return}U.startQuiz=d.id;render()};
A.cancelStart=()=>{U.startQuiz=null;render()};
A.beginQuiz=()=>{
  const q=QUIZZES.find(x=>x.id===U.startQuiz);U.startQuiz=null;
  if(!q){render();return}
  if(S.quizBest[q.id]){toast('You already took this quiz.');render();return}
  U.quiz={id:q.id,snap:{id:q.id,cid:q.cid,t:q.t,qs:q.qs},i:0,picked:null,score:0,res:[]};
  S.active=U.quiz;U.view='quizzes';U.course=null;U.sel=null;U.modal=null;save();render();window.scrollTo(0,0);
};
A.pick=d=>{
  const Q=U.quiz;if(!Q||Q.done||Q.picked!==null)return;
  const cur=Q.snap.qs[Q.i];Q.picked=+d.i;const ok=Q.picked===cur.a;Q.res[Q.i]=ok;if(ok)Q.score++;
  S.active=Q;save();render();
};
A.nextQ=()=>{
  const Q=U.quiz;if(!Q||Q.done||Q.picked===null)return;const q=Q.snap;
  if(Q.i+1<q.qs.length){Q.i++;Q.picked=null;S.active=Q;save();render();return}
  const gained=Q.score*5;
  S.quizBest[q.id]={score:Q.score,total:q.qs.length};Q.done=true;Q.gained=gained;S.active=null;
  if(gained)gain(gained);
  if(Q.score===q.qs.length){award('whiz');confetti(120)}else if(Q.score/q.qs.length>=.8)confetti(60);
  save();render();
};
document.addEventListener('input',e=>{if(e.target.closest&&e.target.closest('#q-form'))collectQ()});

/* keep the teacher's draft while the page re-renders, and accept dropped files */
document.addEventListener('input',e=>{if(e.target.closest&&e.target.closest('#l-form')&&e.target.id!=='l-files')U.draft={cid:val('l-course'),title:val('l-title'),body:val('l-body')}});
document.addEventListener('change',e=>{
  if(e.target.id==='l-course'){U.draft={cid:val('l-course'),title:val('l-title'),body:val('l-body')}}
  if(e.target.id==='l-files'){stage(Array.from(e.target.files||[]));e.target.value=''}
});
document.addEventListener('dragover',e=>{const z=e.target.closest&&e.target.closest('#dz');if(z){e.preventDefault();z.classList.add('over')}});
document.addEventListener('dragleave',e=>{const z=e.target.closest&&e.target.closest('#dz');if(z)z.classList.remove('over')});
document.addEventListener('drop',e=>{const z=e.target.closest&&e.target.closest('#dz');if(z){e.preventDefault();z.classList.remove('over');stage(Array.from(e.dataTransfer.files||[]))}});
(async function init(){
  syncStudents();
  initCaps();
  await ensureDemo();
  let em=null;try{em=localStorage.getItem(SESSION)}catch(e){}
  const acc=em&&S.accounts.find(x=>x.email===em);
  if(acc)startSession(acc,true);else render();
})();
})();
</script>
