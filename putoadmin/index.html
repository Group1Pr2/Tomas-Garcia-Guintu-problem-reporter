<!DOCTYPE html>

<body class="min-h-screen flex flex-col justify-between antialiased selection:bg-puto-yellow selection:text-puto-brown">

  <!-- Toast Notification Container -->
  <div id="toast-container" class="fixed top-4 left-1/2 -translate-x-1/2 z-[120] w-[92vw] max-w-sm pointer-events-none flex flex-col gap-2"></div>

  <!-- Main App Root -->
  <div id="app-root" class="flex-1 flex flex-col"></div>

  <!-- Footer -->
  <footer class="bg-puto-brown text-cream-100 border-t-2 border-puto-dark px-4 py-5 text-center mt-10">
    <p class="text-xs font-extrabold text-puto-yellow tracking-wide">PUTOLOGY Kitchen & Admin Portal</p>
    <p class="text-[11px] text-cream-200/80 mt-0.5">Created by Carlo Dela Cruz</p>
  </footer>

  <script>
    /**
     * =====================================================================
     * 1. SUPABASE & STAFF PIN CONFIGURATION
     * =====================================================================
     * You can paste your Supabase Publishable / Anon key directly below OR
     * paste it right inside the Admin Dashboard's "Database Key" button!
     */
    const ADMIN_PIN = '8824';

    const DEFAULT_SUPABASE_CONFIG = {
      url: 'https://ujxdkgkvypwytvckqnaf.supabase.co',
      anonKey: '' // Optional: paste your sb_publishable_... or eyJ... key here
    };

    const MENU_FLAVORS = [
      { id: 'ube-coco', name: 'Ube Coco', category: 'Sweet', color: '#7E3AF2' },
      { id: 'cookies-cream', name: 'Cookies & Cream', category: 'Sweet', color: '#3E2216' },
      { id: 'pandan-coco', name: 'Pandan Coco', category: 'Sweet', color: '#16A34A' },
      { id: 'peanut-crunch', name: 'Peanut Crunch', category: 'Sweet', color: '#D97706' },
      { id: 'salted-egg', name: 'Salted Egg', category: 'Savory', color: '#EAB308' },
      { id: 'tuna-mayo', name: 'Tuna Mayo', category: 'Savory', color: '#E11D48' }
    ];

    /**
     * =====================================================================
     * 2. SUPABASE REST BRIDGE (SUPPORTS sb_publishable_ AND eyJ KEYS)
     * =====================================================================
     */
    const SupabaseAdminService = (() => {
      const STORAGE_KEY_URL = 'putology_sb_url_v1';
      const STORAGE_KEY_ANON = 'putology_sb_anon_v1';
      const LOCAL_ORDERS_FALLBACK = 'putology_orders_v3';
      const LOCAL_FEEDBACK_FALLBACK = 'putology_feedback_v3';

      function getCredentials() {
        const savedUrl = (localStorage.getItem(STORAGE_KEY_URL) || '').trim();
        const savedKey = (localStorage.getItem(STORAGE_KEY_ANON) || '').trim();
        return {
          url: (savedUrl || DEFAULT_SUPABASE_CONFIG.url).replace(/\/rest\/v1\/?$/, '').replace(/\/$/, ''),
          anonKey: savedKey || DEFAULT_SUPABASE_CONFIG.anonKey
        };
      }

      function saveCredentials(url, anonKey) {
        const cleanUrl = (url || '').trim().replace(/\/rest\/v1\/?$/, '').replace(/\/$/, '');
        const cleanKey = (anonKey || '').trim();
        if (cleanUrl) localStorage.setItem(STORAGE_KEY_URL, cleanUrl);
        if (cleanKey) {
          localStorage.setItem(STORAGE_KEY_ANON, cleanKey);
        } else {
          localStorage.removeItem(STORAGE_KEY_ANON);
        }
      }

      function hasKey() {
        const { url, anonKey } = getCredentials();
        return Boolean(url && anonKey);
      }

      async function request(path, options = {}) {
        const { url, anonKey } = getCredentials();
        if (!url || !anonKey) {
          throw new Error('Missing Supabase API Key');
        }

        const headers = {
          'apikey': anonKey,
          'Content-Type': 'application/json',
          'Prefer': 'return=representation',
          ...(options.headers || {})
        };

        // Supabase expects Authorization Bearer for JWT (eyJ...) keys;
        // for newer sb_publishable_ keys, apikey header authenticates directly.
        if (anonKey.startsWith('eyJ')) {
          headers['Authorization'] = `Bearer ${anonKey}`;
        }

        const res = await fetch(`${url}/rest/v1/${path}`, {
          ...options,
          headers
        });

        if (!res.ok) {
          const errText = await res.text().catch(() => '');
          throw new Error(`HTTP ${res.status}: ${errText || res.statusText}`);
        }
        return res.status === 204 ? null : res.json();
      }

      function getLocalOrders() {
        try {
          return JSON.parse(localStorage.getItem(LOCAL_ORDERS_FALLBACK) || '[]');
        } catch {
          return [];
        }
      }

      function getLocalFeedback() {
        try {
          return JSON.parse(localStorage.getItem(LOCAL_FEEDBACK_FALLBACK) || '[]');
        } catch {
          return [];
        }
      }

      return {
        getCredentials,
        saveCredentials,
        hasKey,
        async fetchOrders() {
          if (!hasKey()) {
            return { live: false, error: 'API key not set yet', data: getLocalOrders() };
          }
          try {
            const rows = await request('pre_orders?select=*&order=created_at.desc');
            const mapped = (rows || []).map(r => ({
              id: r.order_code || r.id,
              dbId: r.id,
              customerName: r.customer_name || 'Walk-in Customer',
              contact: r.contact || 'N/A',
              customerType: r.customer_type || 'Customer',
              pickupDate: r.pickup_date || '2026-11-27',
              pickupTime: r.pickup_time || '15:00',
              paymentMethod: r.payment_method || 'Cash on Pickup',
              gcashRef: r.gcash_ref || '',
              notes: r.notes || '',
              totalAmount: Number(r.total_amount || 0),
              status: r.status || 'Pending',
              createdAt: r.created_at || new Date().toISOString(),
              items: Array.isArray(r.items) ? r.items : []
            }));
            return { live: true, error: null, data: mapped };
          } catch (err) {
            return { live: false, error: err.message, data: getLocalOrders() };
          }
        },
        async createOrder(order) {
          if (hasKey()) {
            await request('pre_orders', {
              method: 'POST',
              body: JSON.stringify({
                order_code: order.id,
                customer_name: order.customerName,
                contact: order.contact,
                customer_type: order.customerType,
                pickup_date: order.pickupDate,
                pickup_time: order.pickupTime,
                payment_method: order.paymentMethod,
                gcash_ref: order.gcashRef || null,
                notes: order.notes || null,
                total_amount: order.totalAmount,
                status: order.status,
                items: order.items
              })
            });
          } else {
            const list = getLocalOrders();
            list.unshift(order);
            localStorage.setItem(LOCAL_ORDERS_FALLBACK, JSON.stringify(list));
          }
        },
        async updateOrderStatus(orderCode, newStatus) {
          if (hasKey()) {
            await request(`pre_orders?order_code=eq.${encodeURIComponent(orderCode)}`, {
              method: 'PATCH',
              body: JSON.stringify({ status: newStatus })
            });
          } else {
            const list = getLocalOrders().map(o => o.id === orderCode ? { ...o, status: newStatus } : o);
            localStorage.setItem(LOCAL_ORDERS_FALLBACK, JSON.stringify(list));
          }
        },
        async deleteOrder(orderCode) {
          if (hasKey()) {
            await request(`pre_orders?order_code=eq.${encodeURIComponent(orderCode)}`, {
              method: 'DELETE'
            });
          } else {
            const list = getLocalOrders().filter(o => o.id !== orderCode);
            localStorage.setItem(LOCAL_ORDERS_FALLBACK, JSON.stringify(list));
          }
        },
        async fetchFeedback() {
          if (!hasKey()) {
            return { live: false, data: getLocalFeedback() };
          }
          try {
            const rows = await request('flavor_suggestions?select=*&order=created_at.desc');
            const mapped = (rows || []).map(r => ({
              id: r.id,
              customerName: r.customer_name || 'Anonymous',
              flavorIdea: r.flavor_idea || 'Flavor Suggestion',
              message: r.message || '',
              status: r.status || 'New',
              createdAt: r.created_at || new Date().toISOString()
            }));
            return { live: true, data: mapped };
          } catch {
            return { live: false, data: getLocalFeedback() };
          }
        },
        async updateFeedbackStatus(id, status) {
          if (hasKey()) {
            await request(`flavor_suggestions?id=eq.${encodeURIComponent(id)}`, {
              method: 'PATCH',
              body: JSON.stringify({ status })
            });
          } else {
            const list = getLocalFeedback().map(f => f.id === id ? { ...f, status } : f);
            localStorage.setItem(LOCAL_FEEDBACK_FALLBACK, JSON.stringify(list));
          }
        },
        async deleteFeedback(id) {
          if (hasKey()) {
            await request(`flavor_suggestions?id=eq.${encodeURIComponent(id)}`, {
              method: 'DELETE'
            });
          } else {
            const list = getLocalFeedback().filter(f => f.id !== id);
            localStorage.setItem(LOCAL_FEEDBACK_FALLBACK, JSON.stringify(list));
          }
        }
      };
    })();

    /**
     * =====================================================================
     * 3. UI HELPERS & PRICING CALCULATORS
     * =====================================================================
     */
    function showToast(msg, type = 'success') {
      const container = document.getElementById('toast-container');
      if (!container) return;
      const toast = document.createElement('div');
      const colors = type === 'error'
        ? 'bg-rose-600 text-white'
        : type === 'warn'
        ? 'bg-amber-400 text-puto-brown'
        : 'bg-puto-brown text-puto-yellow';
      toast.className = `${colors} px-4 py-3 rounded-2xl border-2 border-puto-brown shadow-pop text-xs font-extrabold flex items-center justify-between gap-2 transition-opacity duration-200`;
      toast.textContent = msg;
      container.appendChild(toast);
      setTimeout(() => {
        toast.style.opacity = '0';
        setTimeout(() => toast.remove(), 220);
      }, 3000);
    }

    function renderBambooSteamerLogo(sizeClass = 'w-12 h-12') {
      return `
        <svg viewBox="0 0 80 80" class="${sizeClass} shrink-0" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M28 16C28 11 32 10 32 5" stroke="#7E3AF2" stroke-width="2.5" stroke-linecap="round"/>
          <path d="M40 14C40 9 44 8 44 3" stroke="#16A34A" stroke-width="2.5" stroke-linecap="round"/>
          <path d="M52 17C52 12 56 11 56 6" stroke="#E58E26" stroke-width="2.5" stroke-linecap="round"/>
          <rect x="12" y="45" width="56" height="14" rx="4" fill="#E5A95C" stroke="#3E2216" stroke-width="2.5"/>
          <line x1="12" y1="52" x2="68" y2="52" stroke="#3E2216" stroke-width="2"/>
          <rect x="14" y="33" width="52" height="13" rx="4" fill="#F4C983" stroke="#3E2216" stroke-width="2.5"/>
          <circle cx="30" cy="30" r="7" fill="#7E3AF2" stroke="#3E2216" stroke-width="2.2"/>
          <circle cx="42" cy="28" r="7.5" fill="#F6B93B" stroke="#3E2216" stroke-width="2.2"/>
          <circle cx="52" cy="31" r="6.5" fill="#16A34A" stroke="#3E2216" stroke-width="2.2"/>
          <ellipse cx="40" cy="63" rx="30" ry="6" fill="#B97A3D" stroke="#3E2216" stroke-width="2.5"/>
        </svg>
      `;
    }

    function calculateTieredPutoPrice(totalPieces) {
      const qty = Math.max(0, Math.floor(Number(totalPieces) || 0));
      const dozens = Math.floor(qty / 12);
      const rem = qty % 12;
      const pairs = Math.floor(rem / 2);
      const singles = rem % 2;
      return (dozens * 125) + (pairs * 25) + (singles * 13);
    }

    function calculatePackagingFee(totalPieces) {
      const qty = Math.max(0, Math.floor(Number(totalPieces) || 0));
      if (qty <= 3) return 0;
      return Math.ceil(qty / 6) * 5;
    }

    function extractOrderPieces(order) {
      let totalPieces = 0;
      const byFlavor = {};
      MENU_FLAVORS.forEach(f => { byFlavor[f.id] = 0; });

      (order.items || []).forEach(item => {
        const qty = Number(item.qty || 1);
        if (item.breakdown && typeof item.breakdown === 'object') {
          Object.entries(item.breakdown).forEach(([fid, count]) => {
            const pcs = Number(count || 0) * qty;
            totalPieces += pcs;
            byFlavor[fid] = (byFlavor[fid] || 0) + pcs;
          });
        } else {
          // Fallback parser if manual item lacks breakdown object
          const match = String(item.name || '').match(/(\d+)\s*pc/i);
          const inferred = match ? Number(match[1]) * qty : qty;
          totalPieces += inferred;
        }
      });

      const plates = totalPieces > 0 && totalPieces <= 3 ? 1 : 0;
      const boxes = totalPieces >= 4 ? Math.ceil(totalPieces / 6) : 0;
      return { totalPieces, byFlavor, plates, boxes };
    }

    /**
     * =====================================================================
     * 4. MAIN ADMIN APPLICATION CONTROLLER
     * =====================================================================
     */
    const AdminApp = (() => {
      const state = {
        unlocked: sessionStorage.getItem('putology_admin_unlocked') === 'true',
        liveConnected: false,
        connectionError: null,
        autoRefresh: true,
        activeTab: 'orders', // 'orders' | 'feedback'
        statusFilter: 'All',
        searchQuery: '',
        orders: [],
        feedback: [],
        confirmDeleteCode: null,
        showKeyModal: false,
        showWalkInModal: false
      };

      let refreshTimer = null;

      function startAutoRefresh() {
        if (refreshTimer) clearInterval(refreshTimer);
        refreshTimer = setInterval(() => {
          if (state.unlocked && state.autoRefresh && !state.showKeyModal && !state.showWalkInModal) {
            loadData(true);
          }
        }, 15000);
      }

      async function loadData(silent = false) {
        const [ordersRes, fbRes] = await Promise.all([
          SupabaseAdminService.fetchOrders(),
          SupabaseAdminService.fetchFeedback()
        ]);

        state.liveConnected = ordersRes.live;
        state.connectionError = ordersRes.error;
        state.orders = ordersRes.data;
        state.feedback = fbRes.data;

        render();
        if (!silent) {
          if (ordersRes.live) {
            showToast('Synced live with Supabase!');
          } else {
            showToast('Using local mode — tap "Database Key" to connect Supabase.', 'warn');
          }
        }
      }

      function renderLockScreen() {
        const root = document.getElementById('app-root');
        root.innerHTML = `
          <div class="flex-1 flex items-center justify-center p-4">
            <div class="admin-card max-w-sm w-full p-6 sm:p-7 text-center space-y-5 bg-cream-50">
              <div class="flex justify-center">
                ${renderBambooSteamerLogo('w-16 h-16')}
              </div>

              <div class="space-y-1">
                <span class="inline-block px-3 py-1 rounded-full bg-puto-yellow border border-puto-brown text-[10px] font-extrabold uppercase tracking-wider">
                  Staff & Kitchen Portal
                </span>
                <h1 class="font-display text-3xl font-bold text-puto-brown">PUTOLOGY</h1>
                <p class="text-xs text-puto-brown/75 font-semibold">
                  Enter your 4-digit staff PIN to manage pre-orders & steamer prep.
                </p>
              </div>

              <form onsubmit="AdminApp.handleUnlock(event)" class="space-y-3">
                <input
                  id="pin-field"
                  type="password"
                  inputmode="numeric"
                  maxlength="6"
                  required
                  autofocus
                  placeholder="• • • •"
                  class="w-full px-4 py-3.5 rounded-2xl border-2 border-puto-brown bg-white text-center font-mono text-2xl font-extrabold tracking-[0.4em] focus:outline-none focus:ring-2 focus:ring-ube-500"
                />
                <button type="submit" class="admin-btn w-full py-3.5 bg-puto-pandan text-white text-sm flex items-center justify-center gap-2">
                  <i data-lucide="lock-open" class="w-4 h-4"></i>
                  <span>Unlock Kitchen Dashboard</span>
                </button>
              </form>

              <div class="pt-2 border-t border-puto-brown/15 text-[11px] text-puto-brown/65 font-semibold">
                Batch Production Starts: <strong>November 27, 2026</strong>
              </div>
            </div>
          </div>
        `;
        lucide.createIcons();
      }

      function renderDashboard() {
        const root = document.getElementById('app-root');
        const creds = SupabaseAdminService.getCredentials();

        // Compute KPI metrics
        const activeOrders = state.orders.filter(o =>
          ['Pending', 'Confirmed', 'Preparing', 'Ready'].includes(o.status)
        );
        const pendingCount = state.orders.filter(o => o.status === 'Pending' || o.status === 'Confirmed').length;
        const totalRevenue = state.orders
          .filter(o => o.status !== 'Cancelled')
          .reduce((sum, o) => sum + Number(o.totalAmount || 0), 0);

        const gcashOrders = state.orders.filter(o => o.paymentMethod === 'GCash' && o.status !== 'Cancelled');
        const gcashVerifiedCount = gcashOrders.filter(o => ['Confirmed', 'Preparing', 'Ready', 'Completed'].includes(o.status)).length;
        const gcashPendingCount = gcashOrders.length - gcashVerifiedCount;

        // Compute Steamer Prep Tally across active orders
        let totalSteamerPieces = 0;
        let totalPlatesNeeded = 0;
        let totalBoxesNeeded = 0;
        const flavorTally = {};
        MENU_FLAVORS.forEach(f => { flavorTally[f.id] = 0; });

        activeOrders.forEach(order => {
          const parsed = extractOrderPieces(order);
          totalSteamerPieces += parsed.totalPieces;
          totalPlatesNeeded += parsed.plates;
          totalBoxesNeeded += parsed.boxes;
          Object.entries(parsed.byFlavor).forEach(([fid, count]) => {
            flavorTally[fid] = (flavorTally[fid] || 0) + count;
          });
        });

        // Filter & search orders
        const filteredOrders = state.orders.filter(o => {
          const matchesStatus = state.statusFilter === 'All' || o.status === state.statusFilter;
          const q = state.searchQuery.trim().toLowerCase();
          const matchesSearch = !q ||
            String(o.id || '').toLowerCase().includes(q) ||
            String(o.customerName || '').toLowerCase().includes(q) ||
            String(o.gcashRef || '').toLowerCase().includes(q) ||
            String(o.contact || '').toLowerCase().includes(q);
          return matchesStatus && matchesSearch;
        });

        root.innerHTML = `
          <!-- TOP STICKY HEADER -->
          <header class="sticky top-0 z-40 bg-puto-brown text-cream-50 border-b-2 border-puto-dark px-4 py-3">
            <div class="max-w-6xl mx-auto flex flex-wrap items-center justify-between gap-2">
              <div class="flex items-center gap-2.5">
                ${renderBambooSteamerLogo('w-10 h-10')}
                <div>
                  <div class="flex items-center gap-2">
                    <span class="font-display text-lg sm:text-xl font-bold text-puto-yellow tracking-tight">PUTOLOGY ADMIN</span>
                    <button onclick="AdminApp.openKeyModal()" class="px-2.5 py-0.5 rounded-full text-[10px] font-extrabold border border-black/30 flex items-center gap-1 ${
                      state.liveConnected ? 'bg-puto-pandan text-white' : 'bg-amber-400 text-puto-brown'
                    }">
                      <span class="w-1.5 h-1.5 rounded-full ${state.liveConnected ? 'bg-white animate-pulse' : 'bg-puto-brown'}"></span>
                      <span>${state.liveConnected ? 'Supabase Live' : 'Setup Key / Local'}</span>
                    </button>
                  </div>
                  <p class="text-[10px] text-cream-200/80 font-semibold">Batch Start: Nov 27, 2026 • GCash: Gerald Daluz</p>
                </div>
              </div>

              <div class="flex items-center gap-1.5 sm:gap-2">
                <button onclick="AdminApp.toggleAutoRefresh()" title="Toggle 15s Auto-Refresh" class="px-2.5 py-2 rounded-xl border border-white/20 text-[11px] font-extrabold flex items-center gap-1 ${
                  state.autoRefresh ? 'bg-white/15 text-puto-yellow' : 'bg-transparent text-cream-200/60'
                }">
                  <i data-lucide="radio" class="w-3.5 h-3.5"></i>
                  <span class="hidden sm:inline">${state.autoRefresh ? 'Auto 15s' : 'Paused'}</span>
                </button>

                <button onclick="AdminApp.loadData(false)" class="px-3 py-2 rounded-xl bg-puto-yellow text-puto-brown text-xs font-extrabold flex items-center gap-1">
                  <i data-lucide="refresh-cw" class="w-3.5 h-3.5"></i>
                  <span>Refresh</span>
                </button>

                <button onclick="AdminApp.openKeyModal()" class="px-3 py-2 rounded-xl bg-white/10 hover:bg-white/20 text-white text-xs font-extrabold flex items-center gap-1">
                  <i data-lucide="key-round" class="w-3.5 h-3.5"></i>
                  <span class="hidden sm:inline">DB Key</span>
                </button>

                <button onclick="AdminApp.lock()" class="px-3 py-2 rounded-xl bg-rose-600 text-white text-xs font-extrabold flex items-center gap-1">
                  <i data-lucide="lock" class="w-3.5 h-3.5"></i>
                  <span>Lock</span>
                </button>
              </div>
            </div>
          </header>

          <!-- CONNECTION ALERT BANNER (IF NOT LIVE YET) -->
          ${!state.liveConnected ? `
            <div class="bg-amber-100 border-b-2 border-puto-brown px-4 py-2.5">

      function render() {
        if (!state.unlocked) {
          renderLockScreen();
        } else {
          renderDashboard();
        }
      }

      return {
        init() {
          render();
          if (state.unlocked) {
            loadData(true);
            startAutoRefresh();
          }
        },
        handleUnlock(e) {
          e.preventDefault();
          const val = (document.getElementById('pin-field')?.value || '').trim();
          if (val === ADMIN_PIN) {
            state.unlocked = true;
            sessionStorage.setItem('putology_admin_unlocked', 'true');
            render();
            loadData(false);
            startAutoRefresh();
          } else {
            showToast('Incorrect Staff PIN.', 'error');
          }
        },
        lock() {
          state.unlocked = false;
          sessionStorage.removeItem('putology_admin_unlocked');
          if (refreshTimer) clearInterval(refreshTimer);
          render();
        },
        loadData,
        toggleAutoRefresh() {
          state.autoRefresh = !state.autoRefresh;
          render();
          showToast(state.autoRefresh ? 'Auto-refresh ON (every 15s)' : 'Auto-refresh paused');
        },
        setTab(tab) {
          state.activeTab = tab;
          render();
        },
        setStatusFilter(st) {
          state.statusFilter = st;
          render();
        },
        setSearch(q) {
          state.searchQuery = q;
          render();
        },
        async changeOrderStatus(orderCode, newStatus) {
          try {
            await SupabaseAdminService.updateOrderStatus(orderCode, newStatus);
            showToast(`Order ${orderCode} → ${newStatus}`);
            await loadData(true);
          } catch (err) {
            showToast(`Update failed: ${err.message}`, 'error');
          }
        },
        askDelete(orderCode) {
          state.confirmDeleteCode = orderCode;
          render();
        },
        cancelDelete() {
          state.confirmDeleteCode = null;
          render();
        },
        async confirmDelete(orderCode) {
          try {
            await SupabaseAdminService.deleteOrder(orderCode);
            state.confirmDeleteCode = null;
            showToast(`Deleted order ${orderCode}`);
            await loadData(true);
          } catch (err) {
            showToast(`Delete failed: ${err.message}`, 'error');
          }
        },
        async changeFeedbackStatus(id, status) {
          try {
            await SupabaseAdminService.updateFeedbackStatus(id, status);
            showToast(`Suggestion marked ${status}`);
            await loadData(true);
          } catch (err) {
            showToast(`Update failed: ${err.message}`, 'error');
          }
        },
        async removeFeedback(id) {
          try {
            await SupabaseAdminService.deleteFeedback(id);
            showToast('Suggestion deleted');
            await loadData(true);
          } catch (err) {
            showToast(`Delete failed: ${err.message}`, 'error');
          }
        },
        openKeyModal() {
          state.showKeyModal = true;
          render();
        },
        closeKeyModal() {
          state.showKeyModal = false;
          render();
        },
        async saveSupabaseConfig(e) {
          e.preventDefault();
          const url = document.getElementById('cfg-url').value;
          const key = document.getElementById('cfg-key').value;
          SupabaseAdminService.saveCredentials(url, key);
          state.showKeyModal = false;
          await loadData(false);
        },
        openWalkInModal() {
          state.showWalkInModal = true;
          render();
        },
        closeWalkInModal() {
          state.showWalkInModal = false;
          render();
        },
        async submitWalkInOrder(e) {
          e.preventDefault();
          const breakdown = {};
          const items = [];
          let totalPieces = 0;

          MENU_FLAVORS.forEach(f => {
            const count = Math.max(0, Math.floor(Number(document.getElementById(`wi-qty-${f.id}`)?.value || 0)));
            if (count > 0) {
              breakdown[f.id] = count;
              totalPieces += count;
              items.push({
                name: `${f.name} (${count} pc${count > 1 ? 's' : ''})`,
                qty: 1,
                unitPrice: calculateTieredPutoPrice(count),
                breakdown: { [f.id]: count }
              });
            }
          });

          if (totalPieces === 0) {
            showToast('Please enter at least 1 piece of puto.', 'error');
            return;
          }

          const subtotal = calculateTieredPutoPrice(totalPieces);
          const pkgFee = calculatePackagingFee(totalPieces);
          const totalAmount = subtotal + pkgFee;
          const orderCode = 'PTL-' + Math.floor(1000 + Math.random() * 9000);

          const newOrder = {
            id: orderCode,
            customerName: document.getElementById('wi-name').value.trim(),
            contact: document.getElementById('wi-contact').value.trim(),
            customerType: 'Walk-in / Phone',
            pickupDate: document.getElementById('wi-date').value,
            pickupTime: document.getElementById('wi-time').value,
            paymentMethod: document.getElementById('wi-payment').value,
            gcashRef: document.getElementById('wi-gcash-ref').value.trim(),
            notes: document.getElementById('wi-notes').value.trim(),
            totalAmount,
            status: 'Confirmed',
            createdAt: new Date().toISOString(),
            items
          };

          try {
            await SupabaseAdminService.createOrder(newOrder);
            state.showWalkInModal = false;
            showToast(`Added walk-in order ${orderCode} (₱${totalAmount})`);
            await loadData(true);
          } catch (err) {
            showToast(`Could not save order: ${err.message}`, 'error');
          }
        }
      };
    })();

    window.addEventListener('DOMContentLoaded', () => AdminApp.init());
  </script>
</body>
</html>
