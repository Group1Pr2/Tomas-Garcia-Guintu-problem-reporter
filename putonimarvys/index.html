    /**
     * Exact Tiered Pricing Calculator:
     * 1 pc = ₱13 | 2 pcs = ₱25 | 4 pcs = ₱50 | 6 pcs = ₱75 | 12 pcs = ₱125
     */
    function calculateTieredPutoPrice(totalPieces) {
      const qty = Math.max(0, Math.floor(Number(totalPieces) || 0));
      const dozens = Math.floor(qty / 12);
      const remainderAfterDozens = qty % 12;
      const pairs = Math.floor(remainderAfterDozens / 2);
      const singles = remainderAfterDozens % 2;
      return (dozens * 125) + (pairs * 25) + (singles * 13);
    }

    /**
     * Packaging Fee Rules:
     * 1–3 pcs: Free paper/siomai plate (₱0)
     * 4–6 pcs: 1 Box Packaging (+₱5)
     * 7+ pcs: +₱5 per 6-pc box needed
     */
    function calculatePackagingFee(totalPieces) {
      const qty = Math.max(0, Math.floor(Number(totalPieces) || 0));
      if (qty <= 3) return 0;
      return Math.ceil(qty / 6) * 5;
    }

          createdAt: '2026-11-27T09:15:00+08:00',
          items: [
            { name: 'Sweet & Savory Box (6 pcs)', qty: 1, unitPrice: 75, breakdown: { 'ube-coco': 1, 'cookies-cream': 1, 'peanut-crunch': 1, 'salted-egg': 2, 'tuna-mayo': 1 } },
            { name: 'Ube Coco (2 pcs Pair)', qty: 1, unitPrice: 25, breakdown: { 'ube-coco': 2 } }
          ]

      ];

      const SEED_FEEDBACK = [
        {
          id: 'FB-101',
          customerName: 'Marco Santos',
          flavorIdea: 'Choco Hazelnut Cheese',
          message: 'Would love a Nutella or chocolate hazelnut puto topped with cheddar!',
          status: 'New',
          createdAt: '2026-11-25T14:20:00+08:00'
        }
      ];

      function isSupabaseConfigured() {
        return Boolean(SUPABASE_CONFIG.url && SUPABASE_CONFIG.anonKey);
      }

      async function supabaseFetch(path, options = {}) {
        const res = await fetch(`${SUPABASE_CONFIG.url}/rest/v1/${path}`, {
          ...options,
          headers: {
            'apikey': SUPABASE_CONFIG.anonKey,
            'Authorization': `Bearer ${SUPABASE_CONFIG.anonKey}`,
            'Content-Type': 'application/json',
            'Prefer': 'return=representation',
            ...(options.headers || {})
          }
        });
        if (!res.ok) throw new Error(`Supabase error: ${res.status}`);
        return res.status === 204 ? null : res.json();
      }

      function getLocalOrders() {
        const raw = localStorage.getItem(ORDERS_KEY);
        if (!raw) {
          localStorage.setItem(ORDERS_KEY, JSON.stringify(SEED_ORDERS));
          return [...SEED_ORDERS];
        }
        try {
          return JSON.parse(raw);
        } catch {
          return [...SEED_ORDERS];
        }
      }

      function saveLocalOrders(orders) {
        localStorage.setItem(ORDERS_KEY, JSON.stringify(orders));
      }

      function getLocalFeedback() {
        const raw = localStorage.getItem(FEEDBACK_KEY);
        if (!raw) {
          localStorage.setItem(FEEDBACK_KEY, JSON.stringify(SEED_FEEDBACK));
          return [...SEED_FEEDBACK];
        }
        try {
          return JSON.parse(raw);
        } catch {
          return [...SEED_FEEDBACK];
        }
      }

      function saveLocalFeedback(items) {
        localStorage.setItem(FEEDBACK_KEY, JSON.stringify(items));
      }

      return {
        isSupabaseConfigured,
        async getOrders() {
          if (isSupabaseConfigured()) {
            try {
              const rows = await supabaseFetch('pre_orders?select=*&order=created_at.desc');
              return rows.map(r => ({
                id: r.order_code,
                dbId: r.id,
                customerName: r.customer_name,
                contact: r.contact,
                customerType: r.customer_type || 'Customer',
                pickupDate: r.pickup_date,
                pickupTime: r.pickup_time,
                paymentMethod: r.payment_method,
                gcashRef: r.gcash_ref || '',
                gcashVerified: Boolean(r.gcash_ref),
                notes: r.notes || '',
                totalAmount: Number(r.total_amount || 0),
                status: r.status || 'Pending',
                createdAt: r.created_at,
                items: r.items || []
              }));
            } catch (err) {
              console.warn('Falling back to local orders:', err);
            }
          }
          return getLocalOrders();
        },
        async addOrder(order) {
          if (isSupabaseConfigured()) {
            try {
              await supabaseFetch('pre_orders', {
                method: 'POST',
                body: JSON.stringify({
                  order_code: order.id,
                  customer_name: order.customerName,
                  contact: order.contact,
                  customer_type: order.customerType,
                  pickup_date: order.pickupDate,
                  pickup_time: order.pickupTime,
                  payment_method: order.paymentMethod,
                  gcash_ref: order.gcashRef || null,
                  notes: order.notes || null,
                  total_amount: order.totalAmount,
                  status: order.status,
                  items: order.items
                })
              });
            } catch (err) {
              console.warn('Supabase insert failed, saving locally:', err);
            }
          }
          const current = getLocalOrders();
          current.unshift(order);
          saveLocalOrders(current);
          return order;
        },
        async updateOrder(orderId, patch) {
          if (isSupabaseConfigured() && patch.status) {
            try {
              await supabaseFetch(`pre_orders?order_code=eq.${encodeURIComponent(orderId)}`, {
                method: 'PATCH',
                body: JSON.stringify({ status: patch.status })
              });
            } catch (err) {
              console.warn('Supabase update failed:', err);
            }
          }
          const current = getLocalOrders().map(o => o.id === orderId ? { ...o, ...patch } : o);
          saveLocalOrders(current);
        },
        async deleteOrder(orderId) {
          if (isSupabaseConfigured()) {
            try {
              await supabaseFetch(`pre_orders?order_code=eq.${encodeURIComponent(orderId)}`, {
                method: 'DELETE'
              });
            } catch (err) {
              console.warn('Supabase delete failed:', err);
            }
          }
          const current = getLocalOrders().filter(o => o.id !== orderId);
          saveLocalOrders(current);
        },
        async getFeedback() {
          if (isSupabaseConfigured()) {
            try {
              const rows = await supabaseFetch('flavor_suggestions?select=*&order=created_at.desc');
              return rows.map(r => ({
                id: r.id,
                customerName: r.customer_name,

                status: r.status || 'New',

        async addFeedback(entry) {

          saveLocalFeedback(current);
        },
        async deleteFeedback(id) {
          const current = getLocalFeedback().filter(f => f.id !== id);
          saveLocalFeedback(current);

      function startBatchCountdown() {
        if (countdownInterval) clearInterval(countdownInterval);
        const updateTimer = () => {
          const display = document.getElementById('sf-countdown-display');
          const now = new Date();
          const diff = BATCH_START_DATE - now;

          if (diff <= 0) {
            if (display) display.textContent = '🟢 FRESH BATCHES SERVING NOW!';
            return;
          }

          const days = Math.floor(diff / (1000 * 60 * 60 * 24));
          const hours = Math.floor((diff / (1000 * 60 * 60)) % 24);
          const mins = Math.floor((diff / (1000 * 60)) % 60);
          const secs = Math.floor((diff / 1000) % 60);
          if (display) {
            display.textContent = `First batch in ${days}d ${String(hours).padStart(2, '0')}h ${String(mins).padStart(2, '0')}m ${String(secs).padStart(2, '0')}s`;
          }
        };
        updateTimer();
        countdownInterval = setInterval(updateTimer, 1000);
      }

      function renderMenuGrid() {
        const grid = document.getElementById('sf-menu-grid');
        if (!grid) return;
        const filtered = state.activeCategory === 'All'
          ? MENU_FLAVORS
          : MENU_FLAVORS.filter(f => f.category === state.activeCategory);

        grid.innerHTML = filtered.map(flavor => {
          const selectedPack = state.cardPackChoice[flavor.id] || 'single';
          const includeOptional = Boolean(state.cardToppingChoice[flavor.id]);
          const packLabels = {
            single: { label: '1 pc', price: 13 },
            pair: { label: '2 pcs', price: 25 },
            box6: { label: '6 pcs', price: 75 }
          };
          const activePrice = packLabels[selectedPack].price;

          return `
            <div class="storefront-card bg-white rounded-3xl p-5 flex flex-col justify-between gap-4">
              <div>
                <div class="flex items-start justify-between gap-2">
                  <div class="flex items-center gap-3">
                    ${renderSteamedPutoSVG(flavor.colorTop, flavor.colorAccent, 'w-14 h-14')}
                    <div>
                      <span class="px-2.5 py-0.5 rounded-full text-[10px] font-extrabold ${flavor.badgeClass}">${flavor.badge}</span>
                      <h3 class="font-display text-xl font-bold text-puto-brown mt-1">${flavor.name}</h3>
                    </div>
                  </div>
                  <span class="font-display text-2xl font-bold text-ube-600">₱${activePrice}</span>
                </div>

                <p class="text-xs text-puto-brown/80 mt-2.5 leading-relaxed">${flavor.desc}</p>

                <div class="flex flex-wrap gap-1.5 mt-3">
                  ${flavor.ingredients.map(ing => `
                    <span class="px-2 py-0.5 rounded-lg bg-cream-100 border border-puto-brown/20 text-[10px] font-bold">${ing}</span>
                  `).join('')}
                </div>

                ${flavor.optionalTopping ? `
                  <label class="mt-3 flex items-center gap-2 text-xs font-extrabold text-puto-brown cursor-pointer bg-cream-100 px-3 py-2 rounded-xl border border-puto-brown/25">
                    <input type="checkbox" ${includeOptional ? 'checked' : ''} onchange="StorefrontApp.toggleFlavorTopping('${flavor.id}', this.checked)" class="accent-ube-600 w-4 h-4" />
                    <span>Add Free ${flavor.optionalTopping}</span>
                  </label>
                ` : ''}
              </div>

              <div class="space-y-2.5 pt-2 border-t border-puto-brown/15">
                <div class="grid grid-cols-3 gap-1.5">
                  ${Object.entries(packLabels).map(([key, info]) => `
                    <button type="button" onclick="StorefrontApp.setFlavorPack('${flavor.id}', '${key}')" class="py-1.5 rounded-xl border-2 border-puto-brown text-[11px] font-extrabold ${
                      selectedPack === key ? 'bg-puto-brown text-puto-yellow' : 'bg-cream-50 text-puto-brown'
                    }">
                      ${info.label} (₱${info.price})
                    </button>
                  `).join('')}
                </div>
                <button type="button" onclick="StorefrontApp.addFlavorToCart('${flavor.id}')" class="storefront-btn w-full py-2.5 rounded-xl bg-puto-yellow text-puto-brown text-xs font-extrabold">
                  + Add to Basket (₱${activePrice})
                </button>
              </div>
            </div>
          `;
        }).join('');
      }

      function renderBoxBuilderRows() {
        const container = document.getElementById('sf-box-builder-rows');
        if (!container) return;

        container.innerHTML = MENU_FLAVORS.map(f => {
          const count = state.customBoxCounts[f.id] || 0;
          return `
            <div class="p-3 rounded-2xl bg-cream-100 border-2 border-puto-brown flex items-center justify-between gap-2">
              <div class="flex items-center gap-2 min-w-0">
                ${renderSteamedPutoSVG(f.colorTop, f.colorAccent, 'w-9 h-9')}
                <div class="truncate">
                  <div class="text-xs font-extrabold truncate">${f.name}</div>
                  <div class="text-[10px] font-bold text-puto-brown/70">${f.category}</div>
                </div>
              </div>
              <div class="flex items-center gap-2 shrink-0">
                <button type="button" onclick="StorefrontApp.adjustCustomBox('${f.id}', -1)" class="w-8 h-8 rounded-xl bg-white border-2 border-puto-brown font-extrabold text-sm">−</button>
                <span class="w-5 text-center font-display text-base font-bold">${count}</span>
                <button type="button" onclick="StorefrontApp.adjustCustomBox('${f.id}', 1)" class="w-8 h-8 rounded-xl bg-puto-yellow border-2 border-puto-brown font-extrabold text-sm">+</button>
              </div>
            </div>
          `;
        }).join('');

        const total = getCustomBoxTotalCount();
        const target = state.customBoxTarget;
        const targetPrice = calculateTieredPutoPrice(target);
        const counterEl = document.getElementById('sf-box-counter');
        const addBtn = document.getElementById('sf-add-box-btn');
        const btn6 = document.getElementById('sf-box-size-6');
        const btn12 = document.getElementById('sf-box-size-12');

        if (btn6) {
          btn6.className = `px-3 py-1.5 rounded-xl border-2 border-puto-brown text-xs font-extrabold ${
            target === 6 ? 'bg-puto-brown text-puto-yellow' : 'bg-cream-100 text-puto-brown'
          }`;
        }
        if (btn12) {
          btn12.className = `px-3 py-1.5 rounded-xl border-2 border-puto-brown text-xs font-extrabold ${
            target === 12 ? 'bg-puto-brown text-puto-yellow' : 'bg-cream-100 text-puto-brown'
          }`;
        }
        if (counterEl) counterEl.textContent = `${total} / ${target} pcs`;
        if (addBtn) {
          addBtn.textContent = `Add Custom Box of ${target} (₱${targetPrice}) to Cart`;
          addBtn.disabled = total !== target;
        }
      }

      function updateCartBadges() {
        const { totalPieces, subtotalAmount, packagingFee, totalAmount } = getCartPricingSummary();
        const headerBadge = document.getElementById('sf-header-cart-badge');
        const bottomBadge = document.getElementById('sf-bottom-cart-badge');
        if (headerBadge) headerBadge.textContent = `${totalPieces} pcs`;
        if (bottomBadge) bottomBadge.textContent = `${totalPieces} pcs`;

        const listEl = document.getElementById('sf-cart-items-list');
        const pcsEl = document.getElementById('sf-cart-total-pcs');
        const subtotalEl = document.getElementById('sf-cart-subtotal-price');
        const pkgLabelEl = document.getElementById('sf-cart-packaging-label');
        const pkgFeeEl = document.getElementById('sf-cart-packaging-fee');
        const priceEl = document.getElementById('sf-cart-total-price');
        const gcashDueEl = document.getElementById('sf-gcash-due-amount');

        if (pcsEl) pcsEl.textContent = `${totalPieces} pcs`;
        if (subtotalEl) subtotalEl.textContent = `₱${subtotalAmount}`;
        if (pkgLabelEl) {
          pkgLabelEl.textContent = totalPieces <= 3
            ? 'Packaging (1–3 pcs Free Plate)'
            : 'Box Packaging (4+ pcs)';
        }
        if (pkgFeeEl) {
          pkgFeeEl.textContent = packagingFee === 0 ? 'FREE' : `+₱${packagingFee}`;
          pkgFeeEl.className = packagingFee === 0
            ? 'text-emerald-700 font-extrabold'
            : 'text-amber-700 font-extrabold';
        }
        if (priceEl) priceEl.textContent = `₱${totalAmount}`;
        if (gcashDueEl) gcashDueEl.textContent = `₱${totalAmount}`;

        if (listEl) {
          if (state.cart.length === 0) {
            listEl.innerHTML = `<div class="p-6 text-center text-xs font-bold text-puto-brown/60 bg-white rounded-2xl border-2 border-dashed border-puto-brown/30">Your pre-order basket is empty. Add flavors or bundles!</div>`;
          } else {
            listEl.innerHTML = state.cart.map((item, idx) => `
              <div class="p-3 rounded-2xl bg-white border-2 border-puto-brown flex items-center justify-between gap-2">
                <div class="min-w-0">
                  <div class="text-xs font-extrabold text-puto-brown leading-snug">${item.name}</div>
                  <div class="text-[11px] font-bold text-ube-600">Qty: ${item.qty}</div>
                </div>
                <div class="flex items-center gap-1.5 shrink-0">
                  <button type="button" onclick="StorefrontApp.updateCartQty(${idx}, -1)" class="w-7 h-7 rounded-lg bg-cream-100 border border-puto-brown font-extrabold text-xs">−</button>
                  <span class="w-5 text-center text-xs font-extrabold">${item.qty}</span>
                  <button type="button" onclick="StorefrontApp.updateCartQty(${idx}, 1)" class="w-7 h-7 rounded-lg bg-puto-yellow border border-puto-brown font-extrabold text-xs">+</button>
                </div>
              </div>
            `).join('');
          }
        }
      }

      return {
        mount,
        setCategory(cat) {
          state.activeCategory = cat;
          document.querySelectorAll('.sf-cat-btn').forEach(btn => {
            const active = btn.dataset.cat === cat;
            btn.className = `sf-cat-btn px-4 py-2 rounded-xl border-2 border-puto-brown text-xs font-extrabold shrink-0 ${
              active ? 'bg-puto-brown text-puto-yellow' : 'bg-white text-puto-brown'
            }`;
          });
          renderMenuGrid();
        },
        setFlavorPack(id, pack) {
          state.cardPackChoice[id] = pack;
          renderMenuGrid();
        },
        toggleFlavorTopping(id, checked) {
          state.cardToppingChoice[id] = checked;
        },
        addFlavorToCart(id) {
          const flavor = MENU_FLAVORS.find(f => f.id === id);
          if (!flavor) return;
          const pack = state.cardPackChoice[id] || 'single';
          const piecesMap = { single: 1, pair: 2, box6: 6 };
          const pcs = piecesMap[pack];
          const withTopping = Boolean(state.cardToppingChoice[id] && flavor.optionalTopping);
          const toppingTag = withTopping ? ` + ${flavor.optionalTopping}` : '';
          const packTag = pack === 'single' ? '1 pc' : `${pcs} pcs`;
          const itemName = `${flavor.name} (${packTag}${toppingTag})`;

          const existing = state.cart.find(c => c.name === itemName);
          if (existing) {
            existing.qty += 1;
          } else {
            state.cart.push({
              name: itemName,
              qty: 1,
              unitPrice: calculateTieredPutoPrice(pcs),
              breakdown: { [flavor.id]: pcs }
            });
          }
          updateCartBadges();
          showToast(`Added ${itemName} to basket!`);
        },
        addBundleToCart(bundleId) {
          const bundle = BUNDLE_DEALS.find(b => b.id === bundleId);
          if (!bundle) return;
          const existing = state.cart.find(c => c.name === bundle.name);
          if (existing) {
            existing.qty += 1;
          } else {
            state.cart.push({
              name: bundle.name,
              qty: 1,
              unitPrice: bundle.price,
              breakdown: { ...bundle.breakdown }
            });
          }
          updateCartBadges();
          showToast(`Added ${bundle.name}!`);
        },
        setCustomBoxTarget(targetSize) {
          state.customBoxTarget = targetSize;
          if (getCustomBoxTotalCount() > targetSize) {
            Object.keys(state.customBoxCounts).forEach(k => { state.customBoxCounts[k] = 0; });
          }
          renderBoxBuilderRows();
        },
        adjustCustomBox(id, delta) {
          const currentTotal = getCustomBoxTotalCount();
          const target = state.customBoxTarget;
          const currentVal = state.customBoxCounts[id] || 0;
          if (delta > 0 && currentTotal >= target) {
            showToast(`Box of ${target} is already full!`, true);
            return;
          }
          if (delta < 0 && currentVal <= 0) return;
          state.customBoxCounts[id] = currentVal + delta;
          renderBoxBuilderRows();
        },
        resetCustomBox() {
          Object.keys(state.customBoxCounts).forEach(k => { state.customBoxCounts[k] = 0; });
          renderBoxBuilderRows();
        },
        addCustomBoxToCart() {
          const target = state.customBoxTarget;
          if (getCustomBoxTotalCount() !== target) return;
          const boxPrice = calculateTieredPutoPrice(target);
          const summaryParts = [];
          const breakdown = {};
          MENU_FLAVORS.forEach(f => {
            const c = state.customBoxCounts[f.id] || 0;
            if (c > 0) {
              summaryParts.push(`${c}x ${f.name}`);
              breakdown[f.id] = c;
            }
          });
          state.cart.push({
            name: `Mix & Match Box of ${target} (${summaryParts.join(', ')})`,
            qty: 1,
            unitPrice: boxPrice,
            breakdown
          });
          this.resetCustomBox();
          updateCartBadges();
          showToast(`Added Custom Box of ${target} (₱${boxPrice})!`);
        },
        updateCartQty(index, delta) {
          if (!state.cart[index]) return;
          state.cart[index].qty += delta;
          if (state.cart[index].qty <= 0) {
            state.cart.splice(index, 1);
          }
          updateCartBadges();
        },
        openCart() {
          updateCartBadges();
          startBatchCountdown();
          document.getElementById('sf-cart-drawer')?.classList.remove('hidden');
        },
        closeCart() {
          document.getElementById('sf-cart-drawer')?.classList.add('hidden');
        },
        toggleBatterModal(show) {
          const el = document.getElementById('sf-batter-modal');
          if (!el) return;
          el.classList.toggle('hidden', !show);
        },
        onPaymentChange(val) {
          const pill = document.getElementById('sf-gcash-status-pill');
          if (val === 'GCash') {
            pill?.classList.remove('hidden');
            this.openGcashModal();
          } else {
            pill?.classList.add('hidden');
          }
        },
        openGcashModal() {
          updateCartBadges();
          const input = document.getElementById('sf-gcash-ref-input');
          if (input) input.value = state.gcashRef;
          document.getElementById('sf-gcash-modal')?.classList.remove('hidden');
        },
        closeGcashModal() {
          document.getElementById('sf-gcash-modal')?.classList.add('hidden');
        },
        copyGcashNumber() {
          const num = '09178847886';
          const temp = document.createElement('textarea');
          temp.value = num;
          document.body.appendChild(temp);
          temp.select();
          document.execCommand('copy');
          temp.remove();
          showToast('Copied GCash number: 0917-884-7886');
        },
        saveGcashDetails() {
          const ref = (document.getElementById('sf-gcash-ref-input')?.value || '').trim();
          if (ref.length < 6) {
            showToast('Please enter your GCash Reference Number.', true);
            return;
          }
          state.gcashRef = ref;
          const statusText = document.getElementById('sf-gcash-status-text');
          if (statusText) statusText.textContent = `✅ GCash Ref #${ref} Attached`;
          this.closeGcashModal();
          showToast('GCash Reference saved!');
        },
        async submitPreOrder(e) {
          e.preventDefault();
          if (state.cart.length === 0) {
            showToast('Please add at least 1 puto item to your basket.', true);
            return;
          }
          const paymentMethod = document.querySelector('input[name="sf-payment"]:checked')?.value || 'Cash on Pickup';
          if (paymentMethod === 'GCash' && !state.gcashRef) {
            showToast('Please enter your GCash Reference Number first.', true);
            this.openGcashModal();
            return;
          }

          const pickupDate = document.getElementById('sf-co-date').value;
          if (pickupDate < '2026-11-27') {
            showToast('Pickup date must be November 27, 2026 or later.', true);
            return;
          }

          const { totalPieces, subtotalAmount, packagingFee, totalAmount } = getCartPricingSummary();
          const orderCode = 'PTL-' + Math.floor(1000 + Math.random() * 9000);
          const newOrder = {
            id: orderCode,
            customerName: document.getElementById('sf-co-name').value.trim(),
            contact: document.getElementById('sf-co-contact').value.trim(),
            customerType: document.getElementById('sf-co-type').value,
            pickupDate,
            pickupTime: document.getElementById('sf-co-time').value,
            paymentMethod,
            gcashRef: paymentMethod === 'GCash' ? state.gcashRef : '',
            gcashVerified: false,
            notes: document.getElementById('sf-co-notes').value.trim(),
            totalAmount,
            status: 'Pending',
            createdAt: new Date().toISOString(),
            items: JSON.parse(JSON.stringify(state.cart))
          };

          await OrderStorageService.addOrder(newOrder);

          state.cart = [];
          state.gcashRef = '';
          updateCartBadges();
          this.closeCart();

          const receiptId = document.getElementById('sf-receipt-id');
          const receiptSummary = document.getElementById('sf-receipt-summary');
          if (receiptId) receiptId.textContent = orderCode;
          if (receiptSummary) {
            receiptSummary.innerHTML = `
              <div><strong>Customer:</strong> ${newOrder.customerName}</div>
              <div><strong>Pickup:</strong> ${newOrder.pickupDate} at ${newOrder.pickupTime}</div>
              <div><strong>Total Pieces:</strong> ${totalPieces} pcs (Subtotal ₱${subtotalAmount} + ${packagingFee === 0 ? 'Free Plate' : `₱${packagingFee} Box`})</div>
              <div><strong>Total Due:</strong> ₱${newOrder.totalAmount} (${newOrder.paymentMethod}${newOrder.gcashRef ? ` • Ref #${newOrder.gcashRef}` : ''})</div>
            `;
          }
          document.getElementById('sf-receipt-modal')?.classList.remove('hidden');
        },
        closeReceiptModal() {
          document.getElementById('sf-receipt-modal')?.classList.add('hidden');
        },
        async submitFeedback(e) {
          e.preventDefault();
          const entry = {
            id: 'FB-' + Math.floor(100 + Math.random() * 900),
            customerName: document.getElementById('sf-fb-name').value.trim(),
            flavorIdea: document.getElementById('sf-fb-flavor').value.trim(),
            message: document.getElementById('sf-fb-msg').value.trim(),
            status: 'New',
            createdAt: new Date().toISOString()
          };
          await OrderStorageService.addFeedback(entry);
          e.target.reset();
          showToast('Thank you! Your flavor suggestion was sent to PUTOLOGY.');
        }
      };
    })();

              <div class="flex items-center gap-2">
                <button onclick="AdminPortalApp.refresh()" class="px-3 py-1.5 rounded-xl bg-white/10 text-xs font-extrabold">↻ Refresh</button>
                <button onclick="AdminPortalApp.logout()" class="px-3 py-1.5 rounded-xl bg-rose-600 text-white text-xs font-extrabold">Lock</button>
              </div>
            </div>
          </header>

          <main class="max-w-5xl mx-auto p-4 space-y-5">
           
            <div id="admin-kpi-grid" class="grid grid-cols-2 sm:grid-cols-4 gap-3"></div>

           
            <div class="admin-portal-card p-4 space-y-2.5">
              <div class="flex items-center justify-between">
                <h2 class="font-display text-lg font-bold text-puto-brown">♨️ Active Steamer Tally (Pending + Preparing)</h2>
                <span class="text-[11px] font-extrabold text-ube-600">Auto-Batch Counter</span>
              </div>
              <div id="admin-steamer-tally" class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-6 gap-2"></div>
            </div>

           
            <div class="flex gap-2 overflow-x-auto no-scrollbar">
              <button onclick="AdminPortalApp.setTab('orders')" class="admin-portal-btn px-4 py-2 text-xs ${state.activeTab === 'orders' ? 'bg-puto-yellow text-puto-brown' : 'bg-white text-puto-brown'}">
                📋 Pre-Orders (${state.orders.length})
              </button>
              <button onclick="AdminPortalApp.setTab('feedback')" class="admin-portal-btn px-4 py-2 text-xs ${state.activeTab === 'feedback' ? 'bg-puto-yellow text-puto-brown' : 'bg-white text-puto-brown'}">
                💡 Flavor Ideas (${state.feedback.length})
              </button>
            </div>

            <div id="admin-tab-content"></div>
          </main>
        `;

        renderDashboardContent();
      }

      function renderDashboardContent() {
        const kpiGrid = document.getElementById('admin-kpi-grid');
        const tallyEl = document.getElementById('admin-steamer-tally');
        const tabContent = document.getElementById('admin-tab-content');
        if (!kpiGrid || !tallyEl || !tabContent) return;

        const activeOrders = state.orders.filter(o => o.status === 'Pending' || o.status === 'Preparing');
        const completedRevenue = state.orders
          .filter(o => o.status !== 'Cancelled')
          .reduce((sum, o) => sum + Number(o.totalAmount || 0), 0);

        kpiGrid.innerHTML = `
          <div class="admin-portal-card p-3.5">
            <div class="text-[10px] font-extrabold uppercase text-puto-brown/65">Total Pre-Orders</div>
            <div class="font-display text-2xl font-bold text-puto-brown mt-0.5">${state.orders.length}</div>
          </div>
          <div class="admin-portal-card p-3.5">
            <div class="text-[10px] font-extrabold uppercase text-puto-brown/65">Active in Kitchen</div>
            <div class="font-display text-2xl font-bold text-ube-600 mt-0.5">${activeOrders.length}</div>
          </div>
          <div class="admin-portal-card p-3.5">
            <div class="text-[10px] font-extrabold uppercase text-puto-brown/65">Projected Sales</div>
            <div class="font-display text-2xl font-bold text-emerald-700 mt-0.5">₱${completedRevenue}</div>
          </div>
          <div class="admin-portal-card p-3.5">
            <div class="text-[10px] font-extrabold uppercase text-puto-brown/65">Flavor Ideas</div>
            <div class="font-display text-2xl font-bold text-amber-600 mt-0.5">${state.feedback.length}</div>
          </div>
        `;

        const flavorCounts = {};
        MENU_FLAVORS.forEach(f => { flavorCounts[f.id] = 0; });
        activeOrders.forEach(order => {
          (order.items || []).forEach(item => {
            if (item.breakdown) {
              Object.entries(item.breakdown).forEach(([fid, count]) => {
                flavorCounts[fid] = (flavorCounts[fid] || 0) + (Number(count) * Number(item.qty || 1));
              });
            }
          });
        });

        tallyEl.innerHTML = MENU_FLAVORS.map(f => `
          <div class="p-2.5 rounded-xl bg-cream-100 border border-puto-brown/25 text-center">
            <div class="text-[11px] font-extrabold truncate">${f.name}</div>
            <div class="font-display text-xl font-bold text-ube-600">${flavorCounts[f.id] || 0} pcs</div>
          </div>
        `).join('');

        if (state.activeTab === 'orders') {
          const statuses = ['All', 'Pending', 'Preparing', 'Ready', 'Completed'];
          const visibleOrders = state.statusFilter === 'All'
            ? state.orders
            : state.orders.filter(o => o.status === state.statusFilter);

          tabContent.innerHTML = `
            <div class="space-y-4">
              <div class="flex gap-1.5 overflow-x-auto no-scrollbar">
                ${statuses.map(st => `
                  <button onclick="AdminPortalApp.setStatusFilter('${st}')" class="px-3.5 py-2 rounded-xl border-2 border-puto-brown text-xs font-extrabold shrink-0 ${
                    state.statusFilter === st ? 'bg-puto-brown text-puto-yellow' : 'bg-white text-puto-brown'
                  }">
                    ${st}
                  </button>
                `).join('')}
              </div>

              ${visibleOrders.length === 0 ? `
                <div class="admin-portal-card p-8 text-center text-xs font-bold text-puto-brown/60">No pre-orders in this status filter yet.</div>
              ` : `
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                  ${visibleOrders.map(o => {
                    const nextMap = {
                      Pending: { label: 'Accept & Prepare', next: 'Preparing', cls: 'bg-ube-600 text-white' },
                      Preparing: { label: 'Mark Ready', next: 'Ready', cls: 'bg-emerald-600 text-white' },
                      Ready: { label: 'Complete Pickup', next: 'Completed', cls: 'bg-puto-brown text-puto-yellow' }
                    };
                    const action = nextMap[o.status];

                    return `
                      <div class="admin-portal-card p-4 space-y-3 flex flex-col justify-between">
                        <div class="space-y-2.5">
                          <div class="flex items-start justify-between gap-2">
                            <div>
                              <span class="font-mono text-xs font-extrabold text-ube-600">${o.id}</span>
                              <h3 class="font-display text-xl font-bold text-puto-brown">${o.customerName}</h3>
                              <div class="text-[11px] font-bold text-puto-brown/75">${o.contact} • ${o.customerType}</div>
                            </div>
                            <span class="px-2.5 py-1 rounded-full border border-puto-brown text-[11px] font-extrabold ${
                              o.status === 'Pending' ? 'bg-amber-200' :
                              o.status === 'Preparing' ? 'bg-purple-200' :
                              o.status === 'Ready' ? 'bg-emerald-200' : 'bg-gray-200'
                            }">${o.status}</span>
                          </div>

                          <div class="p-2.5 rounded-xl bg-cream-100 border border-puto-brown/20 text-xs space-y-1">
                            <div><strong>📅 Pickup:</strong> ${o.pickupDate} at ${o.pickupTime}</div>
                            <div><strong>💳 Payment:</strong> ${o.paymentMethod} — <strong class="text-ube-600">₱${o.totalAmount}</strong></div>
                            ${o.gcashRef ? `
                              <div class="flex items-center justify-between pt-1">
                                <span class="font-mono text-[11px] font-extrabold text-sky-800">GCash Ref: ${o.gcashRef}</span>
                                <button onclick="AdminPortalApp.toggleGcashVerify('${o.id}', ${!o.gcashVerified})" class="px-2 py-0.5 rounded-lg text-[10px] font-extrabold border border-puto-brown ${
                                  o.gcashVerified ? 'bg-emerald-500 text-white' : 'bg-amber-200 text-puto-brown'
                                }">
                                  ${o.gcashVerified ? '✓ Verified' : 'Verify GCash'}
                                </button>
                              </div>
                            ` : ''}
                            ${o.notes ? `<div class="text-rose-700 font-bold pt-1">📝 Note: ${o.notes}</div>` : ''}
                          </div>

                          <ul class="text-xs space-y-1 font-bold">
                            ${(o.items || []).map(it => `<li>• ${it.qty}x ${it.name}</li>`).join('')}
                          </ul>
                        </div>

                        <div class="flex gap-2 pt-2 border-t border-puto-brown/15">
                          ${action ? `
                            <button onclick="AdminPortalApp.advanceStatus('${o.id}', '${action.next}')" class="admin-portal-btn flex-1 py-2 text-xs ${action.cls}">
                              ${action.label}
                            </button>
                          ` : `<div class="flex-1 text-center py-2 text-xs font-extrabold text-emerald-700">✓ Order Completed</div>`}
                          <button onclick="AdminPortalApp.removeOrder('${o.id}')" class="admin-portal-btn px-3 py-2 bg-rose-100 text-rose-700 text-xs">
                            Delete
                          </button>
                        </div>
                      </div>
                    `;
                  }).join('')}
                </div>
              `}
            </div>
          `;
        } else {
          tabContent.innerHTML = `
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
              ${state.feedback.length === 0 ? `
                <div class="admin-portal-card p-8 text-center text-xs font-bold text-puto-brown/60 col-span-full">No customer flavor ideas submitted yet.</div>
              ` : state.feedback.map(fb => `
                <div class="admin-portal-card p-4 space-y-2.5">
                  <div class="flex items-start justify-between gap-2">
                    <div>
                      <span class="px-2 py-0.5 rounded-full bg-puto-yellow border border-puto-brown text-[10px] font-extrabold">${fb.status}</span>
                      <h3 class="font-display text-lg font-bold text-ube-600 mt-1">${fb.flavorIdea}</h3>
                      <div class="text-[11px] font-bold text-puto-brown/70">Suggested by ${fb.customerName}</div>
                    </div>
                    <button onclick="AdminPortalApp.removeFeedback('${fb.id}')" class="px-2.5 py-1 rounded-lg bg-rose-100 border border-puto-brown text-[11px] font-extrabold text-rose-700">Delete</button>
                  </div>
                  <p class="text-xs text-puto-brown/85 bg-cream-100 p-3 rounded-xl border border-puto-brown/20">${fb.message}</p>
                </div>
              `).join('')}
            </div>
          `;
        }
      }

      return {
        mount,
        login(e) {
          e.preventDefault();
          const entered = (document.getElementById('admin-pin-input')?.value || '').trim();
          if (entered === ADMIN_CONFIG.PIN) {
            state.authenticated = true;
            mount();
            showToast('Welcome back to PUTOLOGY Admin!');
          } else {
            showToast('Incorrect Staff PIN.', true);
          }
        },
        logout() {
          state.authenticated = false;
          mount();
        },
        refresh() {
          mount();
          showToast('Dashboard refreshed.');
        },
        setTab(tab) {
          state.activeTab = tab;
          renderDashboardContent();
        },
        setStatusFilter(status) {
          state.statusFilter = status;
          renderDashboardContent();
        },
        async advanceStatus(orderId, nextStatus) {
          await OrderStorageService.updateOrder(orderId, { status: nextStatus });
          await mount();
          showToast(`Order ${orderId} marked as ${nextStatus}.`);
        },
        async toggleGcashVerify(orderId, verified) {
          await OrderStorageService.updateOrder(orderId, { gcashVerified: verified });
          await mount();
          showToast(verified ? 'GCash Reference marked Verified!' : 'GCash verification unchecked.');
        },
        async removeOrder(orderId) {
          await OrderStorageService.deleteOrder(orderId);
          await mount();
          showToast(`Deleted order ${orderId}.`);
        },
        async removeFeedback(id) {
          await OrderStorageService.deleteFeedback(id);
          await mount();
          showToast('Flavor suggestion removed.');
        }
      };
    })();


    function handleRoute() {
      const hash = window.location.hash || '#/';
      const storefrontEl = document.getElementById('storefront-root');
      const adminEl = document.getElementById('admin-portal-root');

      if (hash.startsWith('#/admin')) {
        storefrontEl?.classList.add('hidden');
        adminEl?.classList.remove('hidden');
        AdminPortalApp.mount();
      } else {
        adminEl?.classList.add('hidden');
        storefrontEl?.classList.remove('hidden');
        if (!storefrontEl?.innerHTML.trim()) {
          StorefrontApp.mount();
        }
      }
    }

    window.addEventListener('hashchange', handleRoute);
    window.addEventListener('DOMContentLoaded', handleRoute);
  </script>
</body>
</html>
