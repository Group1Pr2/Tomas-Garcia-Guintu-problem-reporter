        return orderObj;

        this.saveOrders(orders);

      const root = document.getElementById('global-toast-root');
      if (!root) return;
      const el = document.createElement('div');
      el.className = `pointer-events-auto px-4 py-3 rounded-2xl border-2 border-puto-brown shadow-pop text-xs font-extrabold flex items-center justify-between gap-2 transition-all ${
        isError ? 'bg-rose-600 text-white' : 'bg-puto-brown text-puto-yellow'
      }`;
      el.innerHTML = `<span>${message}</span>`;
      root.appendChild(el);
      setTimeout(() => {
        el.style.opacity = '0';
        setTimeout(() => el.remove(), 220);
      }, 2800);
    }

      function renderMenuCards() {
        const grid = document.getElementById('sf-menu-grid');
        if (!grid) return;

        const filtered = state.activeCategory === 'All'
          ? MENU_FLAVORS
          : MENU_FLAVORS.filter(f => f.category === state.activeCategory);

        grid.innerHTML = filtered.map(flavor => {
          const pack = state.cardPackChoice[flavor.id] || 'single';
          const optChecked = Boolean(state.cardToppingChoice[flavor.id]);
          const displayPrice = pack === 'box' ? flavor.priceBox : flavor.priceSingle;

          return `
            <div class="storefront-card bg-white rounded-3xl p-4 sm:p-5 flex flex-col justify-between">
              <div>
                <div class="flex items-center justify-between gap-2 mb-2">
                  <span class="px-2.5 py-0.5 rounded-full text-[10px] font-extrabold ${flavor.badgeClass}">${flavor.badge}</span>
                  <span class="text-[11px] font-extrabold text-puto-brown/70">${flavor.category}</span>
                </div>

                <div class="bg-cream-100 border border-puto-brown/20 rounded-2xl py-3 mb-3">
                  ${renderPutoIllustration(flavor.colorTop, flavor.colorAccent)}
                </div>

                <div class="flex items-baseline justify-between gap-2">
                  <h3 class="font-display text-xl font-bold">${flavor.name}</h3>
                  <span class="font-display text-xl font-bold text-ube-600">₱${displayPrice}</span>
                </div>
                <p class="text-xs text-puto-brown/80 mt-1 leading-relaxed">${flavor.desc}</p>

                <div class="flex flex-wrap gap-1 mt-2.5">
                  ${flavor.ingredients.map(ing => `
                    <span class="px-2 py-0.5 rounded-md bg-cream-100 text-[10px] font-bold text-puto-brown/85">${ing}</span>
                  `).join('')}
                </div>

                ${flavor.optionalTopping ? `
                  <label class="mt-3 flex items-center gap-2 p-2 rounded-xl bg-amber-50 border border-amber-300 text-[11px] font-extrabold cursor-pointer">
                    <input type="checkbox" ${optChecked ? 'checked' : ''} onchange="StorefrontApp.toggleFlavorTopping('${flavor.id}', this.checked)" class="w-4 h-4 accent-ube-600" />
                    <span>+ Free ${flavor.optionalTopping}</span>
                  </label>
                ` : ''}
              </div>

              <div class="mt-4 pt-3 border-t border-puto-brown/15 space-y-2.5">
                <div class="grid grid-cols-2 gap-1.5 bg-cream-100 p-1 rounded-xl border border-puto-brown/30 text-[11px] font-extrabold">
                  <button type="button" onclick="StorefrontApp.setPackChoice('${flavor.id}', 'single')" class="py-1.5 rounded-lg ${pack === 'single' ? 'bg-puto-brown text-puto-yellow' : 'text-puto-brown'}">
                    1 Pc (₱${flavor.priceSingle})
                  </button>
                  <button type="button" onclick="StorefrontApp.setPackChoice('${flavor.id}', 'box')" class="py-1.5 rounded-lg ${pack === 'box' ? 'bg-puto-brown text-puto-yellow' : 'text-puto-brown'}">
                    Box of 6 (₱${flavor.priceBox})
                  </button>
                </div>

                <button type="button" onclick="StorefrontApp.addFlavorToCart('${flavor.id}')" class="storefront-btn w-full py-2.5 rounded-xl bg-puto-yellow text-xs font-extrabold">
                  + Add to Cart • ₱${displayPrice}
                </button>
              </div>
            </div>
          `;
        }).join('');
      }

      function renderBoxBuilderRows() {
        const container = document.getElementById('sf-box-builder-rows');
        if (!container) return;

        container.innerHTML = MENU_FLAVORS.map(f => {
          const count = state.customBoxCounts[f.id] || 0;
          return `
            <div class="flex items-center justify-between p-3 rounded-2xl bg-cream-50 border-2 border-puto-brown/25">
              <div>
                <div class="font-display font-bold text-sm">${f.name}</div>
                <div class="text-[10px] font-bold text-puto-brown/65">${f.category}</div>
              </div>
              <div class="flex items-center gap-2">
                <button type="button" onclick="StorefrontApp.adjustCustomBox('${f.id}', -1)" class="w-9 h-9 rounded-xl bg-white border-2 border-puto-brown font-extrabold">-</button>
                <span class="w-5 text-center font-display font-bold text-base">${count}</span>
                <button type="button" onclick="StorefrontApp.adjustCustomBox('${f.id}', 1)" class="w-9 h-9 rounded-xl bg-puto-yellow border-2 border-puto-brown font-extrabold">+</button>
              </div>
            </div>
          `;
        }).join('');

        const total = getCustomBoxTotalCount();
        const counterEl = document.getElementById('sf-box-counter');
        const addBtn = document.getElementById('sf-add-box-btn');
        if (counterEl) counterEl.textContent = `${total} / 6 pcs`;
        if (addBtn) addBtn.disabled = total !== 6;
      }

      function updateCartBadges() {
        const count = getCartCount();
        const hBadge = document.getElementById('sf-header-cart-badge');
        const mBadge = document.getElementById('sf-mobile-cart-badge');
        if (hBadge) hBadge.textContent = count;
        if (mBadge) mBadge.textContent = `Cart (${count})`;
      }

      function renderCartContents() {
        const listEl = document.getElementById('sf-cart-items-list');
        const totalEl = document.getElementById('sf-cart-total');
        if (!listEl || !totalEl) return;

        if (state.cart.length === 0) {
          listEl.innerHTML = `
            <div class="text-center py-6 bg-white rounded-2xl border-2 border-dashed border-puto-brown/30 text-xs font-bold text-puto-brown/70">
              Your cart is empty. Add your favorite puto flavors first!
            </div>
          `;
        } else {
          listEl.innerHTML = state.cart.map((item, idx) => `
            <div class="bg-white border-2 border-puto-brown rounded-2xl p-3 flex items-center justify-between gap-2">
              <div class="min-w-0">
                <div class="font-display font-bold text-sm truncate">${item.name}</div>
                <div class="text-[11px] font-bold text-ube-600">₱${item.unitPrice} each</div>
              </div>
              <div class="flex items-center gap-1.5 shrink-0">
                <button type="button" onclick="StorefrontApp.changeCartQty(${idx}, -1)" class="w-8 h-8 rounded-lg bg-cream-100 border border-puto-brown font-extrabold">-</button>
                <span class="w-5 text-center text-xs font-extrabold">${item.qty}</span>
                <button type="button" onclick="StorefrontApp.changeCartQty(${idx}, 1)" class="w-8 h-8 rounded-lg bg-puto-yellow border border-puto-brown font-extrabold">+</button>
              </div>
            </div>
          `).join('');
        }

        totalEl.textContent = `₱${getCartTotal()}`;
      }

      return {
        mount,
        setCategory(cat) {
          state.activeCategory = cat;
          mount();
        },
        setPackChoice(id, pack) {
          state.cardPackChoice[id] = pack;
          renderMenuCards();
        },
        toggleFlavorTopping(id, checked) {
          state.cardToppingChoice[id] = checked;
        },
        addFlavorToCart(id) {
          const flavor = MENU_FLAVORS.find(f => f.id === id);
          if (!flavor) return;
          const pack = state.cardPackChoice[id] || 'single';
          const hasOpt = Boolean(state.cardToppingChoice[id]) && flavor.optionalTopping;
          const unitPrice = pack === 'box' ? flavor.priceBox : flavor.priceSingle;
          const pieces = pack === 'box' ? 6 : 1;
          const label = `${flavor.name} (${pack === 'box' ? 'Box of 6' : '1 pc'}${hasOpt ? ` • +${flavor.optionalTopping}` : ''})`;

          const existing = state.cart.find(i => i.name === label);
          if (existing) {
            existing.qty += 1;
          } else {
            state.cart.push({
              name: label,
              qty: 1,
              unitPrice,
              breakdown: { [flavor.id]: pieces }
            });
          }
          updateCartBadges();
          showToast(`Added ${label}!`);
        },
        addBundleToCart(bundleId) {
          const b = BUNDLE_DEALS.find(x => x.id === bundleId);
          if (!b) return;
          const existing = state.cart.find(i => i.name === b.name);
          if (existing) {
            existing.qty += 1;
          } else {
            state.cart.push({
              name: b.name,
              qty: 1,
              unitPrice: b.price,
              breakdown: { ...b.breakdown }
            });
          }
          updateCartBadges();
          showToast(`Added ${b.name}!`);
        },
        adjustCustomBox(id, delta) {
          const currentTotal = getCustomBoxTotalCount();
          const currentVal = state.customBoxCounts[id] || 0;
          if (delta > 0 && currentTotal >= 6) {
            showToast('Box of 6 is already full!', true);
            return;
          }
          if (delta < 0 && currentVal <= 0) return;
          state.customBoxCounts[id] = currentVal + delta;
          renderBoxBuilderRows();
        },
        resetCustomBox() {
          Object.keys(state.customBoxCounts).forEach(k => { state.customBoxCounts[k] = 0; });
          renderBoxBuilderRows();
        },
        addCustomBoxToCart() {
          if (getCustomBoxTotalCount() !== 6) return;
          const summaryParts = [];
          const breakdown = {};
          MENU_FLAVORS.forEach(f => {
            const c = state.customBoxCounts[f.id] || 0;
            if (c > 0) {
              summaryParts.push(`${c}x ${f.name}`);
              breakdown[f.id] = c;
            }
          });
          state.cart.push({
            name: `Mix & Match Box (${summaryParts.join(', ')})`,
            qty: 1,
            unitPrice: 95,
            breakdown
          });
          this.resetCustomBox();
          updateCartBadges();
          showToast('Added Custom Box of 6!');
        },
        openCart() {
          renderCartContents();
          const modal = document.getElementById('sf-cart-modal');
          if (modal) {
            modal.classList.remove('hidden');
            modal.classList.add('flex');
          }
        },
        closeCart() {
          const modal = document.getElementById('sf-cart-modal');
          if (modal) {
            modal.classList.add('hidden');
            modal.classList.remove('flex');
          }
        },
        changeCartQty(idx, delta) {
          if (!state.cart[idx]) return;
          state.cart[idx].qty += delta;
          if (state.cart[idx].qty <= 0) {
            state.cart.splice(idx, 1);
          }
          updateCartBadges();
          renderCartContents();
        },
        handlePaymentMethodChange(method) {
          const box = document.getElementById('sf-gcash-status-box');
          if (!box) return;
          if (method === 'GCash') {
            box.classList.remove('hidden');
            this.openGcashModal();
          } else {
            box.classList.add('hidden');
          }
        },
        openGcashModal() {
          const modal = document.getElementById('sf-gcash-modal');
          const amtEl = document.getElementById('sf-gcash-modal-amount');
          const refInput = document.getElementById('sf-gcash-ref-input');
          if (amtEl) amtEl.textContent = `₱${getCartTotal()}`;
          if (refInput) refInput.value = state.gcashRef || '';
          if (modal) {
            modal.classList.remove('hidden');
            modal.classList.add('flex');
          }
        },
        closeGcashModal() {
          const modal = document.getElementById('sf-gcash-modal');
          if (modal) {
            modal.classList.add('hidden');
            modal.classList.remove('flex');
          }
        },
        copyGcashNumber() {
          const rawNum = '09178847886';
          const temp = document.createElement('textarea');
          temp.value = rawNum;
          document.body.appendChild(temp);
          temp.select();
          document.execCommand('copy');
          document.body.removeChild(temp);
          showToast('GCash Number 0917-884-7886 copied!');
        },
        handleGcashProofUpload(e) {
          const file = e.target.files && e.target.files[0];
          if (!file) return;
          const reader = new FileReader();
          reader.onload = ev => {
            state.gcashProofDataUrl = ev.target.result;
            const prev = document.getElementById('sf-gcash-proof-preview');
            if (prev) {
              prev.classList.remove('hidden');
              prev.innerHTML = `<img src="${state.gcashProofDataUrl}" alt="GCash Receipt Preview" class="h-24 rounded-xl border-2 border-puto-brown mx-auto object-cover" />`;
            }
          };
          reader.readAsDataURL(file);
        },
        confirmGcashDetails() {
          const refVal = (document.getElementById('sf-gcash-ref-input').value || '').trim();
          if (refVal.length < 6) {
            showToast('Please enter your GCash Reference Number.', true);
            return;
          }
          state.gcashRef = refVal;
          const statusLabel = document.getElementById('sf-gcash-status-label');
          if (statusLabel) {
            statusLabel.textContent = `✅ GCash Ref #${refVal} Attached`;
          }
          this.closeGcashModal();
          showToast('GCash Reference saved!');
        },
        async submitPreOrder(e) {
          e.preventDefault();
          if (state.cart.length === 0) {
            showToast('Please add at least 1 item to your cart first.', true);
            return;
          }

          const paymentMethod = document.getElementById('sf-co-payment').value;
          if (paymentMethod === 'GCash' && !state.gcashRef) {
            showToast('Please enter your GCash Reference Number first.', true);
            this.openGcashModal();
            return;
          }

          const orderCode = `PUTO-${Math.floor(100 + Math.random() * 900)}`;
          const newOrder = {
            id: `ord-${Date.now()}`,
            orderCode,
            customerName: document.getElementById('sf-co-name').value.trim(),
            contact: document.getElementById('sf-co-contact').value.trim(),
            customerType: document.getElementById('sf-co-type').value,
            pickupDate: document.getElementById('sf-co-date').value,
            pickupTime: document.getElementById('sf-co-time').value,
            paymentMethod,
            gcashRef: paymentMethod === 'GCash' ? state.gcashRef : '',
            gcashVerified: false,
            notes: document.getElementById('sf-co-notes').value.trim(),
            totalAmount: getCartTotal(),
            status: 'Pending',
            createdAt: new Date().toISOString(),
            items: JSON.parse(JSON.stringify(state.cart))
          };

          await OrderStorageService.addOrder(newOrder);

          state.cart = [];
          state.gcashRef = '';
          state.gcashProofDataUrl = '';
          updateCartBadges();
          this.closeCart();

          const receiptBody = document.getElementById('sf-receipt-body');
          if (receiptBody) {
            receiptBody.innerHTML = `
              <div class="flex justify-between"><span>Order Code:</span><strong>${newOrder.orderCode}</strong></div>
              <div class="flex justify-between"><span>Name:</span><strong>${newOrder.customerName}</strong></div>
              <div class="flex justify-between"><span>Pickup:</span><strong>${newOrder.pickupDate} @ ${newOrder.pickupTime}</strong></div>
              <div class="flex justify-between"><span>Payment:</span><strong>${newOrder.paymentMethod}${newOrder.gcashRef ? ` (Ref: ${newOrder.gcashRef})` : ''}</strong></div>
              <div class="flex justify-between border-t border-puto-brown/20 pt-1.5 text-sm"><span>Total Due:</span><strong class="text-ube-600">₱${newOrder.totalAmount}</strong></div>
            `;
          }
          const rModal = document.getElementById('sf-receipt-modal');
          if (rModal) {
            rModal.classList.remove('hidden');
            rModal.classList.add('flex');
          }
        },
        closeReceipt() {
          const rModal = document.getElementById('sf-receipt-modal');
          if (rModal) {
            rModal.classList.add('hidden');
            rModal.classList.remove('flex');
          }
        },
        openBatterModal() {
          const m = document.getElementById('sf-batter-modal');
          if (m) {
            m.classList.remove('hidden');
            m.classList.add('flex');
          }
        },
        closeBatterModal() {
          const m = document.getElementById('sf-batter-modal');
          if (m) {
            m.classList.add('hidden');
            m.classList.remove('flex');
          }
        },
        async submitFeedback(e) {
          e.preventDefault();
          const entry = {
            id: `fb-${Date.now()}`,
            customerName: document.getElementById('sf-fb-name').value.trim(),
            flavorIdea: document.getElementById('sf-fb-flavor').value.trim(),
            message: document.getElementById('sf-fb-msg').value.trim(),
            status: 'New',
            createdAt: new Date().toISOString()
          };
          await OrderStorageService.addFeedback(entry);
          e.target.reset();
          showToast('Thank you! Your flavor idea was sent to PUTOLOGY.');
        }
      };
    })();

        const tally = {};
        MENU_FLAVORS.forEach(f => { tally[f.id] = 0; });

        orders
          .filter(o => o.status === 'Pending' || o.status === 'Preparing')
          .forEach(order => {
            (order.items || []).forEach(item => {
              const qty = item.qty || 1;
              if (item.breakdown) {
                Object.entries(item.breakdown).forEach(([flavorId, pcs]) => {
                  if (tally[flavorId] !== undefined) {
                    tally[flavorId] += pcs * qty;
                  }
                });
              }
            });
          });

        return tally;

                            <span class="font-extrabold text-blue-950">GCash Ref:</span>
                            <span class="font-mono font-bold text-blue-700">${order.gcashRef || 'N/A'}</span>
                          </div>
                          <button onclick="AdminPortalApp.toggleGcash('${order.id}')" class="px-2.5 py-1 rounded-lg text-[11px] font-extrabold border ${
                            order.gcashVerified ? 'bg-green-600 text-white border-green-700' : 'bg-white text-blue-800 border-blue-500'
                          }">
                            ${order.gcashVerified ? '✓ Verified' : 'Verify GCash'}
                          </button>
                        </div>
                      ` : ''}

                      <div class="bg-cream-50 rounded-xl p-2.5 space-y-1 text-xs">
                        ${(order.items || []).map(it => `
                          <div class="flex justify-between font-bold">
                            <span>${it.qty}x ${it.name}</span>
                            <span>₱${it.unitPrice * it.qty}</span>
                          </div>
                        `).join('')}
                        ${order.notes ? `<div class="text-[11px] text-rose-700 font-bold pt-1 border-t border-puto-brown/15">📝 Note: ${order.notes}</div>` : ''}
                      </div>

                      <div class="flex flex-wrap gap-2 pt-1">
                        ${order.status === 'Pending' ? `
                          <button onclick="AdminPortalApp.setOrderStatus('${order.id}', 'Preparing')" class="admin-portal-btn flex-1 px-3 py-2 bg-ube-600 text-white text-xs">
                            🔥 Accept & Prepare
                          </button>
                        ` : ''}
                        ${order.status === 'Preparing' ? `
                          <button onclick="AdminPortalApp.setOrderStatus('${order.id}', 'Ready')" class="admin-portal-btn flex-1 px-3 py-2 bg-green-600 text-white text-xs">
                            ✅ Mark Ready for Pickup
                          </button>
                        ` : ''}
                        ${order.status === 'Ready' ? `
                          <button onclick="AdminPortalApp.setOrderStatus('${order.id}', 'Completed')" class="admin-portal-btn flex-1 px-3 py-2 bg-puto-yellow text-xs">
                            🎉 Complete Pickup
                          </button>
                        ` : ''}
                        <button onclick="AdminPortalApp.removeOrder('${order.id}')" class="admin-portal-btn px-3 py-2 bg-rose-100 text-rose-800 text-xs">
                          Delete
                        </button>
                      </div>
                    </div>
                  `;
                }).join('')}
              </div>
            ` : ''}

            ${adminState.activeTab === 'feedback' ? `
              <div class="space-y-3">
                ${feedback.length === 0 ? `
                  <div class="admin-portal-card p-8 text-center text-xs font-bold text-puto-brown/65">
                    No customer flavor suggestions yet.
                  </div>
                ` : feedback.map(fb => `
                  <div class="admin-portal-card p-4 space-y-2">
                    <div class="flex items-center justify-between gap-2">
                      <div>
                        <span class="font-display font-bold text-base text-ube-700">${fb.flavorIdea}</span>
                        <span class="ml-2 px-2 py-0.5 rounded-full text-[10px] font-extrabold ${fb.status === 'Shortlisted' ? 'bg-puto-yellow' : 'bg-cream-200'}">${fb.status}</span>
                      </div>
                      <span class="text-[11px] font-bold text-puto-brown/65">by ${fb.customerName}</span>
                    </div>
                    <p class="text-xs text-puto-brown/85 leading-relaxed">${fb.message}</p>
                    <div class="flex gap-2 pt-1">
                      <button onclick="AdminPortalApp.toggleShortlist('${fb.id}')" class="admin-portal-btn px-3 py-1.5 bg-puto-yellow text-xs">
                        ${fb.status === 'Shortlisted' ? '★ Shortlisted' : '☆ Shortlist Idea'}
                      </button>
                      <button onclick="AdminPortalApp.removeFeedback('${fb.id}')" class="admin-portal-btn px-3 py-1.5 bg-rose-100 text-rose-800 text-xs">
                        Delete
                      </button>
                    </div>
                  </div>
                `).join('')}
              </div>
            ` : ''}

            ${adminState.activeTab === 'deploy' ? `
              <div class="admin-portal-card p-5 space-y-3 text-xs">
                <h3 class="font-display text-lg font-bold">☁️ Supabase + Vercel Live Sync</h3>
                <p class="text-puto-brown/80 leading-relaxed">
                  Paste your Supabase Project URL and Anon Key into <code>SUPABASE_CONFIG</code> at the top of <code>index.html</code> to persist all customer pre-orders and flavor ideas in the cloud across devices.
                </p>
                <div class="p-3 rounded-xl bg-cream-100 border border-puto-brown/30 font-mono text-[11px] overflow-x-auto">
                  Admin Direct URL: <strong>your-domain.vercel.app/#/admin</strong>
                </div>
              </div>
            ` : ''}
          </main>
        `;
      }

      function mount() {
        const root = document.getElementById('admin-portal-root');
        if (!root) return;
        if (!adminState.authenticated) {
          renderLoginView(root);
        } else {
          renderDashboardView(root);
        }
      }

      return {
        mount,
        handlePinSubmit(e) {
          e.preventDefault();
          const val = document.getElementById('ap-pin-input').value.trim();
          if (val === ADMIN_CONFIG.PIN) {
            adminState.authenticated = true;
            mount();
            showToast('Admin Panel Unlocked!');
          } else {
            showToast('Incorrect PIN. Access denied.', true);
          }
        },
        logout() {
          adminState.authenticated = false;
          mount();
        },
        setTab(tab) {
          adminState.activeTab = tab;
          mount();
        },
        setStatusFilter(status) {
          adminState.statusFilter = status;
          mount();
        },
        setSearch(query) {
          adminState.searchQuery = query;
          mount();
        },
        setOrderStatus(id, status) {
          OrderStorageService.updateOrderStatus(id, status);
          mount();
          showToast(`Order marked ${status}`);
        },
        toggleGcash(id) {
          OrderStorageService.toggleGcashVerified(id);
          mount();
          showToast('GCash verification updated');
        },
        removeOrder(id) {
          OrderStorageService.deleteOrder(id);
          mount();
          showToast('Order removed');
        },
        toggleShortlist(id) {
          OrderStorageService.toggleFeedbackShortlist(id);
          mount();
        },
        removeFeedback(id) {
          OrderStorageService.deleteFeedback(id);
          mount();
          showToast('Suggestion deleted');
        },
        exportCsv() {
          const orders = OrderStorageService.getOrders();
          const rows = [
            ['OrderCode', 'Customer', 'Contact', 'Type', 'PickupDate', 'PickupTime', 'Payment', 'GCashRef', 'Total', 'Status']
          ];
          orders.forEach(o => {
            rows.push([
              o.orderCode,
              `"${(o.customerName || '').replace(/"/g, '""')}"`,
              o.contact,
              o.customerType,
              o.pickupDate,
              o.pickupTime,
              o.paymentMethod,
              o.gcashRef || '',
              o.totalAmount,
              o.status
            ]);
          });
          const csvContent = 'data:text/csv;charset=utf-8,' + rows.map(r => r.join(',')).join('\n');
          const link = document.createElement('a');
          link.setAttribute('href', encodeURI(csvContent));
          link.setAttribute('download', `putology-orders-${new Date().toISOString().split('T')[0]}.csv`);
          document.body.appendChild(link);
          link.click();
          document.body.removeChild(link);
          showToast('Exported orders CSV!');
        }
      };
    })();

    const AppRouter = {
      route() {
        const isAdmin = window.location.hash.startsWith('#/admin');
        const sfRoot = document.getElementById('storefront-root');
        const apRoot = document.getElementById('admin-portal-root');

        if (isAdmin) {
          sfRoot.classList.add('hidden');
          apRoot.classList.remove('hidden');
          AdminPortalApp.mount();
        } else {
          apRoot.classList.add('hidden');
          sfRoot.classList.remove('hidden');
          StorefrontApp.mount();
        }
      },
      navigate(target) {
        if (target === 'admin') {
          window.location.hash = '#/admin';
        } else {
          window.location.hash = '#/';
        }
      }
    };

    window.addEventListener('hashchange', () => AppRouter.route());
    window.onload = function () {
      OrderStorageService.seedDefaultsIfEmpty();
      AppRouter.route();
    };
  </script>
</body>
</html>
