<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nexus Report | Pure Logo with Intense Glow</title>

  <script src="https://cdn.tailwindcss.com"></script>
  
  <style>
    @keyframes assembleLeft {
      0% { transform: translate(-90px, -50px) scale(0.7); opacity: 0; }
      100% { transform: translate(0, 0) scale(1); opacity: 1; }
    }

    @keyframes assembleRight {
      0% { transform: translate(90px, 50px) scale(0.7); opacity: 0; }
      100% { transform: translate(0, 0) scale(1); opacity: 1; }
    }

    @keyframes assembleCore {
      0% { transform: scale(0.1); opacity: 0; }
      50% { opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }

    /* Enhanced intense glowing pulse animation */
    @keyframes intenseGlowPulse {
      0%, 100% {
        filter: drop-shadow(0 0 25px rgba(6, 182, 212, 0.9)) drop-shadow(0 0 60px rgba(34, 211, 238, 0.7)) drop-shadow(0 0 100px rgba(6, 182, 212, 0.4));
      }
      50% {
        filter: drop-shadow(0 0 40px rgba(34, 211, 238, 1)) drop-shadow(0 0 90px rgba(6, 182, 212, 0.9)) drop-shadow(0 0 140px rgba(103, 232, 249, 0.7));
      }
    }

    @keyframes slowLaser {
      0% { stroke-dashoffset: 320; }
      100% { stroke-dashoffset: 0; }
    }

    .logo-container {
      animation: intenseGlowPulse 3.5s ease-in-out infinite;
    }

    .part-left {
      animation: assembleLeft 1.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      transform-origin: center;
    }

    .part-right {
      animation: assembleRight 1.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      transform-origin: center;
    }

    .part-core {
      animation: assembleCore 1.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      transform-origin: center;
    }

    .laser-slow {
      stroke-dasharray: 90 230;
      animation: slowLaser 3.2s linear infinite;
    }
  </style>
</head>
<body class="bg-slate-950 min-h-screen flex items-center justify-center p-0 m-0">

  <svg class="w-96 h-[420px] logo-container" viewBox="0 0 200 220" fill="none" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <linearGradient id="metalBody" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#334155" />
        <stop offset="30%" stop-color="#1e293b" />
        <stop offset="70%" stop-color="#0f172a" />
        <stop offset="100%" stop-color="#020617" />
      </linearGradient>

      <linearGradient id="metalBorder" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="#64748b" />
        <stop offset="100%" stop-color="#0f172a" />
      </linearGradient>

      <!-- Brighter gradient for more vibrant glow -->
      <linearGradient id="cyanGlow" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#a5f3fc" />
        <stop offset="50%" stop-color="#22d3ee" />
        <stop offset="100%" stop-color="#06b6d4" />
      </linearGradient>
    </defs>

    <!-- Left Pillar -->
    <g class="part-left">
      <path d="M10 20 L58 5 L58 205 L25 215 L10 215 Z" fill="url(#metalBody)" stroke="url(#metalBorder)" stroke-width="1.5" />
      <rect x="44" y="45" width="6" height="120" fill="url(#cyanGlow)" rx="3" />
      <rect x="46" y="50" width="2" height="110" fill="#ffffff" rx="1" />
    </g>

    <!-- Right Pillar -->
    <g class="part-right">
      <path d="M190 5 L190 195 L155 215 L142 200 L142 20 Z" fill="url(#metalBody)" stroke="url(#metalBorder)" stroke-width="1.5" />
      <rect x="150" y="45" width="6" height="120" fill="url(#cyanGlow)" rx="3" />
      <rect x="152" y="50" width="2" height="110" fill="#ffffff" rx="1" />
    </g>

    <!-- Central Core & Thick Diagonal Bar with Enhanced Glow Layers -->
    <g class="part-core">
      <path d="M42 5 L158 190 L138 215 L22 30 Z" fill="#090e1a" stroke="#1e293b" stroke-width="2" />
      <path d="M42 20 L158 190 L148 170 L32 0 Z" fill="url(#metalBody)" opacity="0.95" />
      
      <!-- Multi-layered shadow and intense neon tracks -->
      <path d="M40 18 L160 202" stroke="#00f0ff" stroke-width="26" stroke-linecap="square" opacity="0.5" />
      <path d="M40 18 L160 202" stroke="#0284c7" stroke-width="18" stroke-linecap="square" />
      <path d="M40 18 L160 202" stroke="#22d3ee" stroke-width="10" stroke-linecap="square" />
      <path d="M40 18 L160 202" stroke="#a5f3fc" stroke-width="6" stroke-linecap="square" />
      
      <!-- Super bright animated laser stream -->
      <path class="laser-slow" d="M40 18 L160 202" stroke="#ffffff" stroke-width="7" stroke-linecap="square" />
    </g>
  </svg>

</body>
</html>
